<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Торговый Терминал</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    :root{
        --bg: var(--tg-theme-bg-color, #0A0D12);
        --surface: var(--tg-theme-secondary-bg-color, #141922);
        --surface-2: #1B212C;
        --border: rgba(201,169,97,0.16);
        --gold: #C9A961;
        --gold-bright: #E8C874;
        --green: #1FAE64;
        --red: #E5484D;
        --text: var(--tg-theme-text-color, #E8E9ED);
        --text-dim: var(--tg-theme-hint-color, #838C9C);
        --mono: 'SF Mono', 'Roboto Mono', 'Consolas', monospace;
    }
    *{ box-sizing: border-box; }
    body{
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        margin: 0; padding: 14px;
        color: var(--text);
        background: var(--bg);
        user-select: none;
    }
    .container{ max-width: 400px; margin: 0 auto; }

    .ticker-wrap{
        overflow: hidden;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 12px;
        padding: 8px 0;
    }
    .ticker-track{
        display: flex;
        white-space: nowrap;
        animation: scroll-left 22s linear infinite;
    }
    .ticker-item{
        font-family: var(--mono);
        font-size: 12px;
        padding: 0 16px;
        border-right: 1px solid var(--border);
        color: var(--text-dim);
        letter-spacing: 0.2px;
    }
    .ticker-item b{ color: var(--text); font-weight: 600; }
    .t-up{ color: var(--green); }
    .t-down{ color: var(--red); }
    @keyframes scroll-left{
        0%{ transform: translateX(0); }
        100%{ transform: translateX(-50%); }
    }

    .tabs{ display: flex; gap: 8px; margin-bottom: 14px; }
    .tab-btn{
        flex: 1;
        background: var(--surface);
        color: var(--text-dim);
        border: 1px solid var(--border);
        padding: 11px 6px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        font-size: 13px;
        letter-spacing: 0.2px;
        transition: all .15s ease;
    }
    .tab-btn.active{
        background: linear-gradient(135deg, var(--gold), #A9853F);
        color: #14110A;
        border-color: transparent;
    }
    .page{ display: none; }
    .page.active{ display: block; }

    .account-card{
        background: linear-gradient(160deg, var(--surface-2), var(--surface));
        border: 1px solid var(--border);
        padding: 18px 16px;
        border-radius: 14px;
        margin-bottom: 14px;
        position: relative;
        overflow: hidden;
    }
    .account-card::before{
        content: "";
        position: absolute; top: -30%; right: -20%;
        width: 160px; height: 160px;
        background: radial-gradient(circle, rgba(201,169,97,0.15), transparent 70%);
    }
    .account-label{
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-dim);
        margin-bottom: 6px;
    }
    .account-amount{
        font-family: var(--mono);
        font-size: 30px;
        font-weight: 700;
        color: var(--gold-bright);
        letter-spacing: 0.5px;
    }
    .account-amount.negative{ color: var(--red); }
    .account-sub{
        font-size: 11px;
        color: var(--text-dim);
        margin-top: 4px;
    }
    .recap-button{
        display: none;
        margin: 12px auto 0 auto;
        background: var(--red);
        color: #fff;
        border: none;
        padding: 9px 16px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
    }

    .mentor-box{
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 14px;
        margin-bottom: 16px;
        display: flex;
        gap: 10px;
        align-items: flex-start;
    }
    .mentor-icon{ font-size: 20px; flex-shrink: 0; line-height: 1.3; }
    .mentor-body{ min-width: 0; }
    .mentor-label{
        font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.6px;
        color: var(--text-dim); margin-bottom: 3px;
    }
    .mentor-text{
        font-size: 12.5px; line-height: 1.4; color: var(--text);
        transition: opacity .25s ease;
    }

    .amount-box{
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 12px;
    }
    .amount-label{
        font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
        color: var(--text-dim); margin-bottom: 8px;
    }
    .amount-input-row{ display: flex; align-items: center; gap: 8px; }
    .amount-currency{ font-family: var(--mono); font-size: 20px; color: var(--gold-bright); font-weight: 700; }
    .amount-input{
        flex: 1;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 10px;
        font-family: var(--mono);
        font-size: 18px;
        font-weight: 700;
        color: var(--text);
        outline: none;
        min-width: 0;
    }
    .amount-input:focus{ border-color: var(--gold); }
    .quick-amounts{ display: flex; gap: 6px; margin-top: 10px; }
    .quick-chip{
        flex: 1;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 7px 4px;
        text-align: center;
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--text-dim);
        cursor: pointer;
    }
    .quick-chip:active{ border-color: var(--gold); color: var(--gold-bright); }
    .payout-info{
        margin-top: 10px;
        text-align: center;
        font-size: 12.5px;
        color: var(--text-dim);
        min-height: 16px;
    }
    .payout-info b{ color: var(--gold-bright); font-family: var(--mono); }

    .chart-box{
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 8px;
        margin-bottom: 12px;
    }
    .chart-label{
        font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
        color: var(--text-dim); margin-bottom: 6px; text-align: center;
    }
    #marketCanvas{ width: 100%; height: 180px; display: block; }

    .direction-row{ display: flex; gap: 10px; margin-bottom: 6px; }
    .direction-btn{
        flex: 1;
        border: none;
        border-radius: 10px;
        padding: 16px 8px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        letter-spacing: 0.2px;
        display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .direction-btn .dir-arrow{ font-size: 20px; }
    .direction-btn.up{ background: linear-gradient(135deg, #2BD881, var(--green)); color: #06180F; }
    .direction-btn.down{ background: linear-gradient(135deg, #F26065, var(--red)); color: #1A0607; }
    .direction-btn:disabled{ opacity: 0.4; cursor: not-allowed; }

    .history-page .history-list{ display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .history-item{
        display: flex; justify-content: space-between; align-items: center;
        background: var(--surface); border: 1px solid var(--border);
        border-radius: 10px; padding: 10px 12px;
    }
    .history-left{ display: flex; align-items: center; gap: 9px; min-width: 0; }
    .history-icon{ font-size: 19px; flex-shrink: 0; }
    .history-meta{ display: flex; flex-direction: column; min-width: 0; }
    .history-ticker{ font-family: var(--mono); font-weight: 700; font-size: 12.5px; }
    .history-time{ font-size: 10px; color: var(--text-dim); margin-top: 1px; }
    .history-amount{ font-family: var(--mono); font-weight: 700; font-size: 13px; white-space: nowrap; }
    .history-amount.pos{ color: var(--green); }
    .history-amount.neg{ color: var(--red); }
    .empty-history{ text-align: center; color: var(--text-dim); font-size: 12px; padding: 20px 0; }

    .notice{
        border: 1px solid var(--border);
        padding: 11px; border-radius: 9px; margin-top: 14px;
        text-align: center; font-weight: 600; font-size: 13px; display: none;
    }
    .notice.win{ color: var(--green); background: rgba(31,174,100,0.08); }
    .notice.lose{ color: var(--red); background: rgba(229,72,77,0.08); }
    .notice.info{ color: var(--gold-bright); background: rgba(201,169,97,0.08); }

    .order-overlay{
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(4,5,8,0.9); display: none; flex-direction: column;
        justify-content: center; align-items: center; z-index: 1000; gap: 14px;
    }
    .order-label{ font-size: 12px; color: var(--text-dim); font-family: var(--mono); letter-spacing: 0.5px; }
    .order-spinner{
        width: 46px; height: 46px; border-radius: 50%;
        border: 3px solid var(--surface-2);
        border-top-color: var(--gold);
        animation: spin 0.9s linear infinite;
    }
    @keyframes spin{ to{ transform: rotate(360deg); } }
    .order-countdown{
        font-family: var(--mono); font-size: 26px; font-weight: 700; color: var(--gold-bright);
    }

</style>
</head>
<body>
<div class="container">

    <div class="ticker-wrap"><div class="ticker-track" id="tickerTrack"></div></div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('trade-page', event)">📊 Торговля</button>
        <button class="tab-btn" onclick="switchTab('history-page', event)">🕓 История</button>
    </div>

    <div class="account-card">

    <div class="order-overlay" id="orderOverlay">

        <div class="order-spinner"></div>
        <div class="order-countdown" id="orderCountdown">3</div>
    </div>
</div>

<script>
"use strict";

const TICKER_SYMBOLS = ['BTC','ETH','TON','SOL','AAPL','TSLA','NVDA','BNB','XRP','SPX'];

const MENTOR_TIPS = [
    '📈 Замечаю рост интереса к рынку — движение оживилось',

    '🧊 Рынок в боковике — часто перед этим готовится сильное движение',
    '🪙 Короткие сделки традиционно волатильнее — учитывайте это',
    '📐 Разумный размер ставки снижает общий риск',
    '🕰️ Утренние часы часто дают спокойные условия для входа',
    '🌙 Вечерняя сессия обычно менее ликвидна, будьте аккуратны',
    '🧩 Каждая сделка — отдельное решение, не гонитесь за прошлым результатом',
    '📣 На рынке слухи о повышенном спросе на рискованные активы',
    '🛡️ Управление риском — основа устойчивой стратегии',
    '🚦 Смешанные сигналы на рынке — разумно действовать осторожно',
    '🌤️ В целом фон сегодня скорее нейтральный',
    '🧠 Хладнокровие часто ценнее, чем скорость реакции',
    '📚 Изучайте свою историю сделок — какие ставки работают лучше остальных',
    '🪜 Постепенное увеличение ставки часто разумнее разовой крупной суммы',
    '🎢 На рынке сегодня повышенная амплитуда движений',
    '🧮 Не забывайте оценивать соотношение риска и потенциальной прибыли',
    '🛰️ Крупные фонды традиционно двигают рынок медленнее, но увереннее',
    '🍃 Спокойный день — хорошее время для анализа, а не спешки',
    '🔔 Обратите внимание на изменение объёма — часто это ранний сигнал',
    '🧱 Стабильные движения сегодня выглядят увереннее резких скачков',
    '🗺️ Рынок ведёт себя по-разному в течение дня — следите за балансом рисков'
];

const STORAGE_KEY_BALANCE = 'tt_account_balance';
const STORAGE_KEY_HISTORY = 'tt_trade_history';
const MAX_HISTORY_ITEMS = 60;

const BASE_URL = 'https://shrimp-tactful-tricycle.ngrok-free.dev';
const SYNC_INTERVAL_MS = 8000;
const SYNC_DEBOUNCE_MS = 1200;

const state = {
    tg: null,
    userId: null,
    profileLoaded: false,
    history: [],
    balance: 1000,
    currentPayoutPercent: null,
    tradeInProgress: false
};

let audioCtx = null;

function ensureAudioContext() {
    if (!audioCtx) {
        try {
            const AC = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AC();
        } catch (err) {
            console.error('Не удалось создать AudioContext:', err);
            return null;
        }
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }
    return audioCtx;
}

function playClickSound() {
    try {
        const ctx = ensureAudioContext();
        if (!ctx) return;

        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(720, now);
        osc.frequency.exponentialRampToValueAtTime(340, now + 0.06);

        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + 0.09);
    } catch (err) {
        console.error('Ошибка воспроизведения звука клика:', err);
    }
}

function bindClickSound() {
    document.addEventListener('pointerdown', function (evt) {
        const interactive = evt.target.closest(
            'button, .quick-chip, .tab-btn, [onclick]'
        );
        if (interactive) playClickSound();
    }, { passive: true });
}

let syncDebounceTimer = null;
let syncIntervalTimer = null;
let syncInFlight = false;
let profileLoadInFlight = false;

function getInitData() {
    return state.tg && state.tg.initData ? state.tg.initData : '';
}

function showSyncIndicator(text, isError) {
    if (isError) console.warn('[sync]', text);
    else console.log('[sync]', text);
}

async function loadUserProfileFromServer() {
    if (!state.userId) return;
    profileLoadInFlight = true;
    try {
        const response = await fetch(
            `${BASE_URL}/api/get_profile?user_id=${encodeURIComponent(state.userId)}`,
            { headers: { 'ngrok-skip-browser-warning': 'true' } }
        );
        if (!response.ok) throw new Error('Сервер вернул статус ' + response.status);
        const data = await response.json();

        if (data.status === 'success') {
            state.balance = parseFloat(data.balance);
            state.history = data.history || [];
            state.profileLoaded = true;
            persistBalance({ skipSync: true });
            persistHistoryLocalOnly();
            renderBalance();
            renderHistory();
            showSyncIndicator('профиль загружен', false);
        }
    } catch (err) {
        console.error('Не удалось загрузить профиль с сервера:', err);
        showSyncIndicator('офлайн: локальные данные', true);
        state.profileLoaded = true;
    } finally {
        profileLoadInFlight = false;
    }
}

async function syncDataWithBot() {
    if (syncInFlight || profileLoadInFlight) return;
    if (!state.userId) return;

    const payload = {
        user_id: state.userId,
        balance: state.balance,
        history: state.history,
        initData: getInitData()
    };

    syncInFlight = true;
    try {
        const response = await fetch(`${BASE_URL}/api/sync`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'ngrok-skip-browser-warning': 'true'
            },
            body: JSON.stringify(payload)
        });

        if (!response.ok) throw new Error('Сервер вернул статус ' + response.status);
        showSyncIndicator('синхронизировано', false);
    } catch (err) {
        console.error('Ошибка синхронизации с ботом:', err);
        showSyncIndicator('ошибка синхронизации', true);
    } finally {
        syncInFlight = false;
    }
}

function scheduleSync() {
    if (!state.profileLoaded) return;
    clearTimeout(syncDebounceTimer);
    syncDebounceTimer = setTimeout(syncDataWithBot, SYNC_DEBOUNCE_MS);
}

function startPeriodicSync() {
    if (syncIntervalTimer) clearInterval(syncIntervalTimer);
    syncIntervalTimer = setInterval(syncDataWithBot, SYNC_INTERVAL_MS);
}

async function init() {
    try {
        state.tg = window.Telegram ? window.Telegram.WebApp : null;
        if (state.tg) {
            state.tg.enableClosingConfirmation();
            state.tg.expand();
            state.tg.ready();
        }

        state.userId = (state.tg && state.tg.initDataUnsafe && state.tg.initDataUnsafe.user)
            ? state.tg.initDataUnsafe.user.id
            : 99999;

        loadState();
        renderBalance();
        renderHistory();
        buildTicker();
        bindAmountInput();
        bindQuickAmounts();
        bindDirectionButtons();
        bindStaticButtons();
        bindClickSound();
        initMarketChart();
        scheduleMentorTip(true);
        setInterval(refreshTicker, 4000);

        await loadUserProfileFromServer();
        startPeriodicSync();
    } catch (err) {
        console.error('Ошибка инициализации терминала:', err);
    }
}

function loadState() {
    try {
        const savedBalance = localStorage.getItem(STORAGE_KEY_BALANCE);
        if (savedBalance !== null) state.balance = parseFloat(savedBalance);
    } catch (err) {
        console.error('Не удалось прочитать баланс счёта:', err);
    }
    try {
        const savedHistory = localStorage.getItem(STORAGE_KEY_HISTORY);
        state.history = savedHistory ? JSON.parse(savedHistory) : [];
    } catch (err) {
        console.error('Не удалось прочитать историю операций:', err);
        state.history = [];
    }
}

function persistBalance(options) {
    try { localStorage.setItem(STORAGE_KEY_BALANCE, String(state.balance)); }
    catch (err) { console.error('Не удалось сохранить баланс:', err); }
    if (!options || !options.skipSync) scheduleSync();
}

function persistHistory() {
    persistHistoryLocalOnly();
    scheduleSync();
}

function persistHistoryLocalOnly() {
    try { localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(state.history)); }
    catch (err) { console.error('Не удалось сохранить историю операций:', err); }
}

function buildTicker() {
    const track = document.getElementById('tickerTrack');
    const items = [];
    for (let i = 0; i < 2; i++) {
        TICKER_SYMBOLS.forEach(sym => items.push(makeTickerItem(sym)));
    }
    track.innerHTML = items.join('');
}

function makeTickerItem(symbol) {
    const change = (Math.random() * 6 - 2.5).toFixed(2);
    const up = parseFloat(change) >= 0;
    const arrow = up ? '📈' : '📉';
    const cls = up ? 't-up' : 't-down';
    const sign = up ? '+' : '';
    return `<span class="ticker-item"><b>${symbol}</b> ${arrow} <span class="${cls}">${sign}${change}%</span></span>`;
}

function refreshTicker() {
    try { buildTicker(); } catch (err) { console.error('Ошибка обновления котировок:', err); }
}

let lastMentorIndex = -1;

function scheduleMentorTip(immediate) {
    if (immediate) showRandomMentorTip();
    const delay = randomBetween(2 * 60 * 1000, 7 * 60 * 1000);
    setTimeout(() => {
        showRandomMentorTip();
        scheduleMentorTip(false);
    }, delay);
}

function showRandomMentorTip() {
    const el = document.getElementById('mentorText');
    if (!el) return;
    let idx;
    do { idx = Math.floor(Math.random() * MENTOR_TIPS.length); }
    while (idx === lastMentorIndex && MENTOR_TIPS.length > 1);
    lastMentorIndex = idx;

    el.style.opacity = '0';
    setTimeout(() => {
        el.textContent = MENTOR_TIPS[idx];
        el.style.opacity = '1';
    }, 200);
}

function randomBetween(min, max) {
    return min + Math.random() * (max - min);
}

function bindAmountInput() {
    const input = document.getElementById('amountInput');
    input.addEventListener('input', handleAmountChange);
}

function bindQuickAmounts() {
    document.querySelectorAll('.quick-chip').forEach(chip => {
        chip.addEventListener('click', () => {
            document.getElementById('amountInput').value = chip.dataset.amount;
            handleAmountChange();
        });
    });
}

function handleAmountChange() {
    const amount = getEnteredAmount();
    const upBtn = document.getElementById('upButton');
    const downBtn = document.getElementById('downButton');
    const payoutInfo = document.getElementById('payoutInfo');

    if (amount > 0) {
        state.currentPayoutPercent = Math.floor(randomBetween(80, 90));
        payoutInfo.innerHTML = `Текущая доходность сделки: <b>${state.currentPayoutPercent}%</b>`;
        upBtn.disabled = false;
        downBtn.disabled = false;
    } else {
        state.currentPayoutPercent = null;
        payoutInfo.textContent = '';
        upBtn.disabled = true;
        downBtn.disabled = true;
    }
}

function getEnteredAmount() {
    const raw = parseFloat(document.getElementById('amountInput').value);
    if (isNaN(raw) || raw <= 0) return 0;
    return round2(raw);
}

let marketCandles = [];
let marketChartTimer = null;

function initMarketChart() {
    marketCandles = generateInitialCandles(34);
    drawMarketChart();
    if (marketChartTimer) clearInterval(marketChartTimer);
    marketChartTimer = setInterval(tickMarketChart, 2500);
    window.addEventListener('resize', drawMarketChart);
}

function generateInitialCandles(n) {
    let price = 100;
    const arr = [];
    for (let i = 0; i < n; i++) {
        const candle = buildNextCandle(price);
        arr.push(candle);
        price = candle.c;
    }
    return arr;
}

function buildNextCandle(openPrice) {
    const open = openPrice;
    const change = (Math.random() - 0.48) * (open * 0.03 + 1);
    let close = open + change;
    if (close < 5) close = 5 + Math.random() * 3;
    const high = Math.max(open, close) + Math.random() * (open * 0.015 + 0.5);
    const low = Math.max(1, Math.min(open, close) - Math.random() * (open * 0.015 + 0.5));
    const volume = 15 + Math.random() * 85;
    return { o: open, h: high, l: low, c: close, v: volume };
}

function tickMarketChart() {
    if (state.tradeInProgress) return;
    const last = marketCandles[marketCandles.length - 1];
    const next = buildNextCandle(last.c);
    marketCandles.push(next);
    if (marketCandles.length > 34) marketCandles.shift();
    drawMarketChart();
}

function drawMarketChart() {
    const canvas = document.getElementById('marketCanvas');
    if (!canvas || marketCandles.length === 0) return;

    const dpr = window.devicePixelRatio || 1;
    const cssWidth = canvas.clientWidth || 320;
    const cssHeight = canvas.clientHeight || 180;
    canvas.width = cssWidth * dpr;
    canvas.height = cssHeight * dpr;
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssWidth, cssHeight);

    const priceAreaH = cssHeight * 0.68;
    const volumeAreaTop = cssHeight * 0.72;
    const volumeAreaH = cssHeight * 0.28;

    const highs = marketCandles.map(c => c.h);
    const lows = marketCandles.map(c => c.l);
    const maxPrice = Math.max(...highs);
    const minPrice = Math.min(...lows);
    const priceRange = Math.max(maxPrice - minPrice, 0.01);

    const maxVolume = Math.max(...marketCandles.map(c => c.v), 1);

    const n = marketCandles.length;
    const slotWidth = cssWidth / n;
    const bodyWidth = Math.max(2, slotWidth * 0.55);

    marketCandles.forEach((candle, i) => {
        const x = i * slotWidth + slotWidth / 2;
        const up = candle.c >= candle.o;
        const color = up ? getCssVar('--green') : getCssVar('--red');

        const yHigh = priceAreaH - ((candle.h - minPrice) / priceRange) * priceAreaH;
        const yLow = priceAreaH - ((candle.l - minPrice) / priceRange) * priceAreaH;
        const yOpen = priceAreaH - ((candle.o - minPrice) / priceRange) * priceAreaH;
        const yClose = priceAreaH - ((candle.c - minPrice) / priceRange) * priceAreaH;

        ctx.strokeStyle = color;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, yHigh);
        ctx.lineTo(x, yLow);
        ctx.stroke();

        const bodyTop = Math.min(yOpen, yClose);
        const bodyHeight = Math.max(1.5, Math.abs(yClose - yOpen));
        ctx.fillStyle = color;
        ctx.fillRect(x - bodyWidth / 2, bodyTop, bodyWidth, bodyHeight);

        const volHeight = (candle.v / maxVolume) * volumeAreaH;
        ctx.globalAlpha = 0.55;
        ctx.fillRect(x - bodyWidth / 2, volumeAreaTop + (volumeAreaH - volHeight), bodyWidth, volHeight);
        ctx.globalAlpha = 1;
    });
}

function getCssVar(name) {
    return getComputedStyle(document.body).getPropertyValue(name).trim() || '#888';
}

function switchTab(pageId, evt) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    if (evt && evt.currentTarget) evt.currentTarget.classList.add('active');
    if (pageId === 'history-page') renderHistory();
    hideNotice();
}

function renderBalance() {
    const el = document.getElementById('globalBalance');
    const formatted = formatMoney(state.balance);
    el.textContent = formatted;
    el.classList.toggle('negative', state.balance < 0);

    const sub = document.getElementById('accountSub');
    sub.textContent = state.balance < 0
        ? 'Статус: маржинальное требование не исполнено'
        : 'Статус: активен';

    document.getElementById('recapButton').style.display = state.balance <= 0 ? 'block' : 'none';
}

function adjustBalance(delta) {
    state.balance = round2(state.balance + delta);
    persistBalance();
    renderBalance();
}

function formatMoney(value) {
    const sign = value < 0 ? '-' : '';
    return sign + '$' + Math.abs(value).toLocaleString('en-US', { maximumFractionDigits: 2, minimumFractionDigits: 0 });
}

function formatSignedMoney(value) {
    const sign = value >= 0 ? '+' : '-';
    return sign + '$' + Math.abs(value).toLocaleString('en-US', { maximumFractionDigits: 2, minimumFractionDigits: 0 });
}

function round2(value) {
    return Math.round(value * 100) / 100;
}

function bindDirectionButtons() {
    document.getElementById('upButton').addEventListener('click', () => placeTrade('up'));
    document.getElementById('downButton').addEventListener('click', () => placeTrade('down'));
}

function placeTrade(direction) {
    try {
        if (state.tradeInProgress) return;
        const amount = getEnteredAmount();
        if (amount <= 0) {
            showNotice('Укажите сумму инвестиции', false);
            return;
        }
        if (amount > state.balance) {
            showNotice('Недостаточно средств на счёте для этой сделки', false);
            return;
        }
        if (!state.currentPayoutPercent) {
            state.currentPayoutPercent = Math.floor(randomBetween(80, 90));
        }

        state.tradeInProgress = true;
        document.getElementById('upButton').disabled = true;
        document.getElementById('downButton').disabled = true;

        adjustBalance(-amount);

        runTradeCountdown(() => resolveTrade(direction, amount, state.currentPayoutPercent));
    } catch (err) {
        console.error('Ошибка открытия сделки:', err);
        showNotice('Ошибка исполнения ордера', false);
        state.tradeInProgress = false;
    }
}

function runTradeCountdown(onComplete) {
    const overlay = document.getElementById('orderOverlay');
    const countdownEl = document.getElementById('orderCountdown');
    let secondsLeft = 3;
    countdownEl.textContent = secondsLeft;
    overlay.style.display = 'flex';

    const timer = setInterval(() => {
        secondsLeft -= 1;
        if (secondsLeft > 0) {
            countdownEl.textContent = secondsLeft;
        } else {
            clearInterval(timer);
            overlay.style.display = 'none';
            onComplete();
        }
    }, 1000);
}

function resolveTrade(direction, amount, payoutPercent) {
    try {
        const last = marketCandles[marketCandles.length - 1];
        const nextCandle = buildNextCandle(last.c);
        marketCandles.push(nextCandle);
        if (marketCandles.length > 34) marketCandles.shift();
        drawMarketChart();

        const candleWentUp = nextCandle.c >= nextCandle.o;
        const won = (direction === 'up' && candleWentUp) || (direction === 'down' && !candleWentUp);

        let netChange;
        if (won) {
            const profit = round2(amount * (payoutPercent / 100));
            netChange = amount + profit;
            adjustBalance(netChange);
        } else {
            netChange = -amount;
        }

        addHistoryEntry(direction, amount, netChange);

        const arrow = direction === 'up' ? '▲' : '▼';
        if (won) {
            showNotice(`${arrow} Сделка выиграна: ${formatSignedMoney(netChange)}`, true);
        } else {
            showNotice(`${arrow} Сделка проиграна: ${formatSignedMoney(netChange)}`, false);
        }

        state.tradeInProgress = false;
        document.getElementById('upButton').disabled = getEnteredAmount() <= 0;
        document.getElementById('downButton').disabled = getEnteredAmount() <= 0;
    } catch (err) {
        console.error('Ошибка резолва сделки:', err);
        showNotice('Ошибка исполнения ордера', false);
        state.tradeInProgress = false;
    }
}

function addHistoryEntry(direction, amount, netChange) {
    state.history.unshift({
        direction: direction,
        amount: amount,
        profit: netChange,
        timestamp: Date.now()
    });
    if (state.history.length > MAX_HISTORY_ITEMS) {
        state.history.length = MAX_HISTORY_ITEMS;
    }
    persistHistory();
    if (document.getElementById('history-page').classList.contains('active')) {
        renderHistory();
    }
}

function renderHistory() {
    const list = document.getElementById('historyList');
    if (!list) return;
    list.innerHTML = '';

    if (state.history.length === 0) {
        list.innerHTML = '<div class="empty-history">Операций пока нет</div>';
        return;
    }

    state.history.forEach(entry => {
        const row = document.createElement('div');
        row.className = 'history-item';

        const left = document.createElement('div');
        left.className = 'history-left';

        const icon = document.createElement('div');
        icon.className = 'history-icon';
        icon.textContent = entry.direction === 'up' ? '▲' : '▼';

        const meta = document.createElement('div');
        meta.className = 'history-meta';

        const tickerEl = document.createElement('div');
        tickerEl.className = 'history-ticker';
        tickerEl.textContent = `${entry.direction === 'up' ? 'Вверх' : 'Вниз'} · ${formatMoney(entry.amount)}`;

        const timeEl = document.createElement('div');
        timeEl.className = 'history-time';
        timeEl.textContent = new Date(entry.timestamp).toLocaleString(undefined, {
            day: '2-digit', month: '2-digit',
            hour: '2-digit', minute: '2-digit'
        });

        meta.append(tickerEl, timeEl);
        left.append(icon, meta);

        const amountEl = document.createElement('div');
        const isPositive = entry.profit >= 0;
        amountEl.className = `history-amount ${isPositive ? 'pos' : 'neg'}`;
        amountEl.textContent = formatSignedMoney(entry.profit);

        row.append(left, amountEl);
        list.appendChild(row);
    });
}

function bindStaticButtons() {
    document.getElementById('recapButton').addEventListener('click', executeRecapitalization);
}

function executeRecapitalization() {
    try {
        if (state.balance > 0) return;
        adjustBalance(100);
        showNotice('Экстренная докапитализация счёта: +$100', true);
    } catch (err) {
        console.error('Ошибка докапитализации счёта:', err);
    }
}

let noticeTimer = null;

function showNotice(message, isPositive) {
    const el = document.getElementById('noticeBox');
    el.textContent = message;
    el.className = `notice ${isPositive ? 'win' : 'lose'}`;
    el.style.display = 'block';
    if (noticeTimer) clearTimeout(noticeTimer);
    noticeTimer = setTimeout(hideNotice, 4500);
}

function hideNotice() {
    document.getElementById('noticeBox').style.display = 'none';
}

document.addEventListener('DOMContentLoaded', init);
</script>
