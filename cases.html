<style>

        --surface-2: #1B212C;
        --border: rgba(201,169,97,0.16);
        --gold: #C9A961;
        --gold-bright: #E8C874;
        --green: #1FAE64;

        --text-dim: var(--tg-theme-hint-color, #838C9C);

    }
    *{ box-sizing: border-box; }
    body{
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        margin: 0; padding: 14px;
        color: var(--text);
        background: var(--bg);

    .container{ max-width: 400px; margin: 0 auto; }

    .ticker-wrap{

        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 12px;

    .ticker-track{
        display: flex;

        animation: scroll-left 22s linear infinite;
    }
    .ticker-item{

        font-size: 12px;
        padding: 0 16px;

        color: var(--text-dim);
        letter-spacing: 0.2px;

    .t-up{ color: var(--green); }
    .t-down{ color: var(--red); }

        0%{ transform: translateX(0); }
        100%{ transform: translateX(-50%); }
    }

    .tab-btn{
        flex: 1;
        background: var(--surface);
        color: var(--text-dim);
        border: 1px solid var(--border);
        padding: 11px 6px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        font-size: 13px;
        letter-spacing: 0.2px;
        transition: all .15s ease;
    }
    .tab-btn.active{
        background: linear-gradient(135deg, var(--gold), #A9853F);
        color: #14110A;
        border-color: transparent;
    }
    .page{ display: none; }
    .page.active{ display: block; }

        color: var(--text-dim);

        color: #fff;

        border-radius: 8px;

        font-weight: 600;

function clamp01(value) {
    return Math.max(0, Math.min(1, value));
}

let audioCtx = null;

function ensureAudioContext() {
    if (!audioCtx) {
        try {
            const AC = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AC();
        } catch (err) {
            console.error('Не удалось создать AudioContext:', err);
            return null;
        }
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }
    return audioCtx;
}

function playClickSound() {
    try {
        const ctx = ensureAudioContext();
        if (!ctx) return;

        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(720, now);
        osc.frequency.exponentialRampToValueAtTime(340, now + 0.06);

        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + 0.09);
    } catch (err) {
        console.error('Ошибка воспроизведения звука клика:', err);
    }
}

// Звук "поглощения" летящей цифры большим табло — разный для +/-, короткий
// и не навязчивый, поскольку может звучать до нескольких раз за сделку.
function playMergeSound(positive) {
    try {
        const ctx = ensureAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = positive ? 'triangle' : 'sine';

        if (positive) {
            osc.frequency.setValueAtTime(520, now);
            osc.frequency.exponentialRampToValueAtTime(940, now + 0.09);
        } else {
            osc.frequency.setValueAtTime(340, now);
            osc.frequency.exponentialRampToValueAtTime(180, now + 0.14);
        }

        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.22, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + (positive ? 0.16 : 0.2));

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + (positive ? 0.18 : 0.22));
    } catch (err) {
        console.error('Ошибка звука обновления суммы:', err);
    }
}

function bindClickSound() {
    document.addEventListener('pointerdown', function (evt) {
        const interactive = evt.target.closest(
            'button, .quick-chip, .tab-btn, [onclick]'
        );
        if (interactive) playClickSound();
    }, { passive: true });
}

let profileLoadInFlight = false;

function getInitData() {
    return state.tg && state.tg.initData ? state.tg.initData : '';
}

function showSyncIndicator(text, isError) {
    if (isError) console.warn('[sync]', text);
    else console.log('[sync]', text);
}

async function loadUserProfileFromServer() {
    if (!state.userId) return;
    profileLoadInFlight = true;
    try {
        const response = await fetch(
            `${BASE_URL}/api/get_profile?user_id=${encodeURIComponent(state.userId)}`,
            { headers: { 'ngrok-skip-browser-warning': 'true' } }
        );
        if (!response.ok) throw new Error('Сервер вернул статус ' + response.status);
        const data = await response.json();

        if (data.status === 'success') {
            state.balance = parseFloat(data.balance);
            state.history = data.history || [];
            state.profileLoaded = true;
            persistBalance({ skipSync: true });
            persistHistoryLocalOnly();
            renderBalance();
            renderHistory();
            showSyncIndicator('профиль загружен', false);
        }
// ... предыдущий блок с загрузкой профиля ...
    } catch (err) {
        console.error('Не удалось загрузить профиль с сервера:', err);
        showSyncIndicator('офлайн: локальные данные', true);
        state.profileLoaded = true;
    } finally {
        profileLoadInFlight = false;
    }
}

let hasUnsyncedTrade = false; // Глобальный флаг для запоминания сделок

async function syncDataWithBot() {
    if (syncInFlight || profileLoadInFlight) return;
    if (!state.userId) return;

    // Забираем флаг сделки и сразу сбрасываем его
    const sendingTrade = hasUnsyncedTrade;
    hasUnsyncedTrade = false; 

    const payload = {
        user_id: state.userId,
        balance: state.balance,
        history: state.history,
        initData: getInitData(),
        trade_done: sendingTrade // Отправляем true, если накопилась сделка
    };

    syncInFlight = true;
    try {
        const response = await fetch(`${BASE_URL}/api/sync`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'ngrok-skip-browser-warning': 'true'
            },
            body: JSON.stringify(payload)
        });

        if (!response.ok) throw new Error('Сервер вернул статус ' + response.status);
        showSyncIndicator('синхронизировано', false);
    } catch (err) {
        console.error('Ошибка синхронизации с ботом:', err);
        showSyncIndicator('ошибка синхронизации', true);
        
        // ВАЖНО: Если произошла ошибка сети, возвращаем флаг сделки обратно!
        // Она отправится при следующей успешной попытке.
        if (sendingTrade) {
            hasUnsyncedTrade = true;
        }
    } finally {
        syncInFlight = false;
    }
}

function scheduleSync(isTrade = false) {
    if (!state.profileLoaded) return;
    
    // Если пришел сигнал о новой сделке - запоминаем глобально!
    if (isTrade) {
        hasUnsyncedTrade = true;
    }

    clearTimeout(syncDebounceTimer);
    syncDebounceTimer = setTimeout(syncDataWithBot, SYNC_DEBOUNCE_MS);
}

async function init() {
    try {
        state.tg = window.Telegram ? window.Telegram.WebApp : null;
        if (state.tg) {
            state.tg.enableClosingConfirmation();
            state.tg.expand();
            state.tg.ready();
        }

        state.userId = (state.tg && state.tg.initDataUnsafe && state.tg.initDataUnsafe.user)
            ? state.tg.initDataUnsafe.user.id
            : 99999;

        loadState();
        renderBalance();
        renderHistory();
        buildTicker();
        bindAmountInput();
        bindQuickAmounts();
        bindDirectionButtons();
        bindStaticButtons();
        bindClickSound();
        initMarketChart();
        scheduleMentorTip(true);
        setInterval(refreshTicker, 4000);

        await loadUserProfileFromServer();
        startPeriodicSync();
    } catch (err) {
        console.error('Ошибка инициализации терминала:', err);
    }
}

function loadState() {
    try {
        const savedBalance = localStorage.getItem(STORAGE_KEY_BALANCE);
        if (savedBalance !== null) state.balance = parseFloat(savedBalance);
    } catch (err) {
        console.error('Не удалось прочитать баланс счёта:', err);
    }
    try {
        const savedHistory = localStorage.getItem(STORAGE_KEY_HISTORY);
        state.history = savedHistory ? JSON.parse(savedHistory) : [];
    } catch (err) {
        console.error('Не удалось прочитать историю операций:', err);
        state.history = [];
    }
}

function persistBalance(options) {
    try { localStorage.setItem(STORAGE_KEY_BALANCE, String(state.balance)); }
    catch (err) { console.error('Не удалось сохранить баланс:', err); }
    if (!options || !options.skipSync) scheduleSync();
}

function persistHistory() {
    persistHistoryLocalOnly();
    scheduleSync();
}

function persistHistoryLocalOnly() {
    try { localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(state.history)); }
    catch (err) { console.error('Не удалось сохранить историю операций:', err); }
}

function buildTicker() {
    const track = document.getElementById('tickerTrack');
    const items = [];
    for (let i = 0; i < 2; i++) {
        TICKER_SYMBOLS.forEach(sym => items.push(makeTickerItem(sym)));
    }
    track.innerHTML = items.join('');
}

function makeTickerItem(symbol) {
    const change = (Math.random() * 6 - 2.5).toFixed(2);
    const up = parseFloat(change) >= 0;
    const arrow = up ? '📈' : '📉';
    const cls = up ? 't-up' : 't-down';
    const sign = up ? '+' : '';
    return `<span class="ticker-item"><b>${symbol}</b> ${arrow} <span class="${cls}">${sign}${change}%</span></span>`;
}

function refreshTicker() {
    try { buildTicker(); } catch (err) { console.error('Ошибка обновления котировок:', err); }
}

let lastMentorIndex = -1;

function scheduleMentorTip(immediate) {
    if (immediate) showRandomMentorTip();
    const delay = randomBetween(2 * 60 * 1000, 7 * 60 * 1000);
    setTimeout(() => {
        showRandomMentorTip();
        scheduleMentorTip(false);
    }, delay);
}

function showRandomMentorTip() {
    const el = document.getElementById('mentorText');
    if (!el) return;
    let idx;
    do { idx = Math.floor(Math.random() * MENTOR_TIPS.length); }
    while (idx === lastMentorIndex && MENTOR_TIPS.length > 1);
    lastMentorIndex = idx;

    el.style.opacity = '0';
    setTimeout(() => {
        el.textContent = MENTOR_TIPS[idx];
        el.style.opacity = '1';
    }, 200);
}

function randomBetween(min, max) {
    return min + Math.random() * (max - min);
}

function bindAmountInput() {
    const input = document.getElementById('amountInput');
    input.addEventListener('input', handleAmountChange);
}

function bindQuickAmounts() {
    document.querySelectorAll('.quick-chip').forEach(chip => {
        chip.addEventListener('click', () => {
            document.getElementById('amountInput').value = chip.dataset.amount;
            handleAmountChange();
        });
    });
}

function handleAmountChange() {
    const amount = getEnteredAmount();
    const upBtn = document.getElementById('upButton');
    const downBtn = document.getElementById('downButton');

    if (amount > 0) {
        if (!state.tradeInProgress) {
            upBtn.disabled = false;
            downBtn.disabled = false;
        }
    } else {
        upBtn.disabled = true;
        downBtn.disabled = true;
    }
}

function getEnteredAmount() {
    const raw = parseFloat(document.getElementById('amountInput').value);
    if (isNaN(raw) || raw <= 0) return 0;
    return round2(raw);
}

/* =========================================================
   РЫНОЧНЫЙ ГРАФИК: СВЕЧИ + ОБЪЁМ + РАЗМЕТКА СДЕЛКИ + ЗУМ
   ========================================================= */

let marketCandles = [];
let marketChartTimer = null;

function initMarketChart() {
    marketCandles = generateInitialCandles(34);
    drawMarketChart();
    if (marketChartTimer) clearInterval(marketChartTimer);
    marketChartTimer = setInterval(tickMarketChart, 2500);
    window.addEventListener('resize', drawMarketChart);
}

function generateInitialCandles(n) {
    let price = 100;
    const arr = [];
    for (let i = 0; i < n; i++) {
        const candle = buildNextCandle(price);
        arr.push(candle);
        price = candle.c;
    }
    return arr;
}

function buildNextCandle(openPrice) {
    const open = openPrice;
    const change = (Math.random() - 0.48) * (open * 0.03 + 1);
    let close = open + change;
    if (close < 5) close = 5 + Math.random() * 3;
    const high = Math.max(open, close) + Math.random() * (open * 0.015 + 0.5);
    const low = Math.max(1, Math.min(open, close) - Math.random() * (open * 0.015 + 0.5));
    const volume = 15 + Math.random() * 85;
    return { o: open, h: high, l: low, c: close, v: volume };
}

function tickMarketChart() {
    if (state.tradeInProgress) return; // не двигаем ленту во время открытой сделки
    const last = marketCandles[marketCandles.length - 1];
    const next = buildNextCandle(last.c);
    marketCandles.push(next);
    if (marketCandles.length > 34) marketCandles.shift();
    drawMarketChart();
}

// Собирает геометрию графика в одном месте — разметка сделки считается
// по тем же координатам, что и свечи, поэтому при ресайзе/скролле всё
// остаётся синхронно.
function computeChartGeometry(cssWidth, cssHeight) {
    const priceAreaH = cssHeight * 0.68;
    const volumeAreaTop = cssHeight * 0.72;
    const volumeAreaH = cssHeight * 0.28;

    const highs = marketCandles.map(c => c.h);
    const lows = marketCandles.map(c => c.l);
    const maxPrice = Math.max(...highs);
    const minPrice = Math.min(...lows);
    const priceRange = Math.max(maxPrice - minPrice, 0.01);

    const maxVolume = Math.max(...marketCandles.map(c => c.v), 1);

    const n = marketCandles.length;
    const slotWidth = cssWidth / n;
    const bodyWidth = Math.max(2, slotWidth * 0.55);

    return {
        cssWidth, cssHeight,
        priceAreaH, volumeAreaTop, volumeAreaH,
        minPrice, maxPrice, priceRange, maxVolume,
        n, slotWidth, bodyWidth
    };
}

function priceToY(price, geo) {
    return geo.priceAreaH - ((price - geo.minPrice) / geo.priceRange) * geo.priceAreaH;
}

function indexToX(index, geo) {
    return index * geo.slotWidth + geo.slotWidth / 2;
}

function indexToSlotRightEdge(index, geo) {
    return (index + 1) * geo.slotWidth;
}

// Камера сделки в три фазы:
// 1) ZOOM-IN — приближаем именно точку открытия сделки, она плавно
//    перемещается к центру экрана по мере роста масштаба (без рывка в момент
//    старта — на scale=1 позиция ещё совпадает с обычной, нетронутой лентой).
// 2) SLIDE — масштаб держится на максимуме, а камера едет вслед за
//    последней дорисовывающейся свечой, удерживая её в центре экрана.
// 3) ZOOM-OUT — после раскрытия результата масштаб и сдвиг камеры плавно
//    возвращаются к 1 и 0, то есть ровно к обычному виду ленты.
const ZOOM_IN_END = 0.14;
const MAX_ZOOM = 1.8;
const ZOOM_FLOOR = 1.0;
const ZOOM_SAFE_FRACTION = 0.5;

function getLeadIndex(trade) {
    const growT = clamp01((trade.animProgress || 0) / TRADE_GROW_END);
    const leadFraction = growT * trade.pathCandles.length;
    return trade.entryIndex + leadFraction;
}

function getChartCameraTransform(geo) {
    const trade = state.activeTrade;
    const centerX = geo.cssWidth / 2;
    const centerY = geo.priceAreaH / 2;
    if (!trade) return { scale: 1, panX: 0, panY: 0 };

    const p = trade.animProgress || 0;
    const ZOOM_OUT_START = TRADE_GROW_END;

    const leadIndex = getLeadIndex(trade);
    const leadX = leadIndex * geo.slotWidth + geo.slotWidth / 2;
    const focusY = priceToY(trade.entryPrice, geo);
    const peakZoom = trade.zoomTarget || MAX_ZOOM;

    if (p < ZOOM_OUT_START) {
        const ramp = p <= ZOOM_IN_END ? easeOutCubic(clamp01(p / ZOOM_IN_END)) : 1;
        const scale = p <= ZOOM_IN_END
            ? 1 + (peakZoom - 1) * ramp
            : peakZoom;

        const panX = leadX * (1 - scale) + (centerX - leadX) * ramp;
        const panY = focusY * (1 - scale) + (centerY - focusY) * ramp;
        return { scale, panX, panY };
    }

    const u = easeInCubic(clamp01((p - ZOOM_OUT_START) / (1 - ZOOM_OUT_START)));
    const scaleAtHold = peakZoom;
    const panXAtHold = leadX * (1 - scaleAtHold) + (centerX - leadX) * 1;
    const panYAtHold = focusY * (1 - scaleAtHold) + (centerY - focusY) * 1;

    const scale = lerpNum(scaleAtHold, 1, u);
    const panX = lerpNum(panXAtHold, 0, u);
    const panY = lerpNum(panYAtHold, 0, u);
    return { scale, panX, panY };
}

function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeInCubic(t) { return t * t * t; }
function lerpNum(a, b, t) { return a + (b - a) * t; }

function drawMarketChart() {
    const canvas = document.getElementById('marketCanvas');
    if (!canvas || marketCandles.length === 0) return;

    const dpr = window.devicePixelRatio || 1;
    const cssWidth = canvas.clientWidth || 320;
    const cssHeight = canvas.clientHeight || 180;
    canvas.width = cssWidth * dpr;
    canvas.height = cssHeight * dpr;
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssWidth, cssHeight);

    const geo = computeChartGeometry(cssWidth, cssHeight);
    const cam = getChartCameraTransform(geo);

    ctx.save();
    if (cam.scale !== 1 || cam.panX !== 0 || cam.panY !== 0) {
        ctx.translate(cam.panX, cam.panY);
        ctx.scale(cam.scale, cam.scale);
    }

    drawTradeZoneFill(ctx, geo);

    const trade = state.activeTrade;
    const growTNow = trade ? clamp01((trade.animProgress || 0) / TRADE_GROW_END) : 0;

    marketCandles.forEach((candle, i) => {
        // Свечи сделки, чья очередь ещё не наступила, не рисуем вообще —
        // иначе их плоское "нулевое" тело выдаёт будущую позицию заранее.
        if (trade && i > trade.entryIndex && i <= trade.expiryIndex) {
            const offset = i - trade.entryIndex - 1;
            const segStart = offset / trade.pathCandles.length;
            if (growTNow <= segStart) return;
        }

        const x = indexToX(i, geo);
        const up = candle.c >= candle.o;
        const color = up ? getCssVar('--green') : getCssVar('--red');

        const yHigh = priceToY(candle.h, geo);
        const yLow = priceToY(candle.l, geo);
        const yOpen = priceToY(candle.o, geo);
        const yClose = priceToY(candle.c, geo);

        ctx.strokeStyle = color;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, yHigh);
        ctx.lineTo(x, yLow);
        ctx.stroke();

        const bodyTop = Math.min(yOpen, yClose);
        const bodyHeight = Math.max(1.5, Math.abs(yClose - yOpen));
        ctx.fillStyle = color;
        ctx.fillRect(x - geo.bodyWidth / 2, bodyTop, geo.bodyWidth, bodyHeight);

        const volHeight = (candle.v / geo.maxVolume) * geo.volumeAreaH;
        ctx.globalAlpha = 0.55;
        ctx.fillRect(x - geo.bodyWidth / 2, geo.volumeAreaTop + (geo.volumeAreaH - volHeight), geo.bodyWidth, volHeight);
        ctx.globalAlpha = 1;
    });

    drawTradeLines(ctx, geo);

    ctx.restore();

    // Летящие цифры рисуем ПОСЛЕ снятия трансформации камеры — в обычных
    // экранных координатах, чтобы полёт к табло не искажался масштабом/паном
    // и текст оставался чётким.
    drawFlyingPopups(ctx);
}

// Переводит точку данных (x,y в координатах ленты) в экранные пиксели с
// учётом текущего состояния камеры (панорама + масштаб).
function projectToScreen(x, y, cam) {
    return { x: cam.panX + cam.scale * x, y: cam.panY + cam.scale * y };
}

// Не даёт точке уехать за верх/низ видимой области холста.
function clampScreenY(y, cssHeight) {
    const margin = 14;
    return Math.max(margin, Math.min(cssHeight - margin, y));
}

/* ---- Разметка активной сделки ---- */

// Пока сделка не раскрыта (revealed === false) — зона окрашена нейтрально
// (золотистое "дыхание"), чтобы не выдавать исход заранее. После раскрытия
// плавно перетекает в зелёное/красное свечение и угасает — без резких скачков.
function drawTradeZoneFill(ctx, geo) {
    const trade = state.activeTrade;
    if (!trade) return;

    const xStart = indexToX(trade.entryIndex, geo);
    const xEnd = indexToSlotRightEdge(trade.expiryIndex, geo);
    const yEntry = priceToY(trade.entryPrice, geo);
    const zoneX = Math.min(xStart, xEnd);
    const zoneWidth = Math.abs(xEnd - xStart);

    const entrance = clamp01(((trade.animProgress || 0) - ZOOM_IN_END) / 0.06);

    ctx.save();

    if (!trade.revealed) {
        const breathe = Math.sin(performance.now() / 260) * 0.5 + 0.5;
        const alpha = (0.07 + breathe * 0.05) * entrance;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = 'rgb(201, 169, 97)';
        if (trade.direction === 'up') ctx.fillRect(zoneX, 0, zoneWidth, yEntry);
        else ctx.fillRect(zoneX, yEntry, zoneWidth, geo.priceAreaH - yEntry);
        ctx.restore();
        ctx.globalAlpha = 1;
        return;
    }

    const revealT = clamp01((trade.animProgress - TRADE_GROW_END) / (1 - TRADE_GROW_END));
    const rgb = trade.result === 'win' ? '0, 255, 0' : '255, 0, 0';
    let alpha;

    if (trade.result === 'win') {
        ctx.shadowBlur = 24;
        ctx.shadowColor = `rgba(${rgb}, 0.9)`;
        const pulse = Math.sin(performance.now() / 170) * 0.5 + 0.5;
        const burstIn = Math.sin(Math.min(revealT / 0.22, 1) * (Math.PI / 2));
        const fadeOut = 1 - clamp01((revealT - 0.62) / 0.38);
        alpha = (0.16 + pulse * 0.22) * burstIn * fadeOut;
    } else {
        alpha = 0.14 * (1 - clamp01(revealT / 0.65));
    }

    ctx.globalAlpha = Math.max(0, alpha);
    ctx.fillStyle = `rgb(${rgb})`;
    if (trade.direction === 'up') ctx.fillRect(zoneX, 0, zoneWidth, yEntry);
    else ctx.fillRect(zoneX, yEntry, zoneWidth, geo.priceAreaH - yEntry);

    ctx.restore();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
}

// Вертикальные линии старта/финиша + горизонтальная линия входа.
function drawTradeLines(ctx, geo) {
    const trade = state.activeTrade;
    if (!trade) return;

    const xStart = indexToX(trade.entryIndex, geo);
    const xEnd = indexToX(trade.expiryIndex, geo);
    const xZoneRightEdge = indexToSlotRightEdge(trade.expiryIndex, geo);
    const yEntry = priceToY(trade.entryPrice, geo);

    const entrance = clamp01(((trade.animProgress || 0) - ZOOM_IN_END) / 0.06);
    let lineAlpha = entrance;
    let glowFinish = false;
    const glowRgb = trade.result === 'win' ? '0, 255, 0' : '255, 0, 0';

    if (trade.revealed) {
        const revealT = clamp01((trade.animProgress - TRADE_GROW_END) / (1 - TRADE_GROW_END));
        if (trade.result === 'win') {
            glowFinish = true;
            lineAlpha = 1 - clamp01((revealT - 0.55) / 0.45);
        } else {
            lineAlpha = 1 - clamp01(revealT / 0.6);
        }
    }

    ctx.save();
    ctx.globalAlpha = Math.max(0, lineAlpha);
    ctx.setLineDash([4, 3]);
    ctx.lineWidth = 1;
    ctx.strokeStyle = getCssVar('--gold-bright');

    ctx.beginPath();
    ctx.moveTo(xStart, 0);
    ctx.lineTo(xStart, geo.priceAreaH);
    ctx.stroke();

    if (glowFinish) {
        ctx.shadowBlur = 18;
        ctx.shadowColor = `rgba(${glowRgb}, 0.9)`;
    }
    ctx.beginPath();
    ctx.moveTo(xEnd, 0);
    ctx.lineTo(xEnd, geo.priceAreaH);
    ctx.stroke();

    ctx.shadowBlur = 0;
    ctx.restore();
    ctx.globalAlpha = 1;

    ctx.save();
    ctx.globalAlpha = Math.max(0, lineAlpha);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = getCssVar('--gold-bright');
    ctx.beginPath();
    ctx.moveTo(xStart, yEntry);
    ctx.lineTo(xZoneRightEdge, yEntry);
    ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
}

// Летящие цифры: рождаются у точки на графике, где произошёл очередной тик,
// и летят (с ускорением) к большому табло внизу экрана. В момент "прилёта"
// они поглощаются табло — табло обновляется, пульсирует и звучит.
function drawFlyingPopups(ctx) {
    const trade = state.activeTrade;
    if (!trade || !trade.flyingPopups) return;

    const now = performance.now();

    trade.flyingPopups.forEach(popup => {
        const t = clamp01((now - popup.bornAt) / FLIGHT_MS);

        if (t >= 1) {
            if (!popup.merged) {
                popup.merged = true;
                mergePopupIntoTotal(trade, popup.delta);
            }
            return;
        }

        const eased = t * t; // easeIn — разгоняется к цели, как будто её "засасывает"
        const x = popup.startX + (popup.targetX - popup.startX) * eased;
        const y = popup.startY + (popup.targetY - popup.startY) * eased;
        const scale = 1 - 0.6 * t;
        const alpha = t < 0.75 ? 1 : (1 - (t - 0.75) / 0.25);

        ctx.save();
        ctx.globalAlpha = Math.max(0, alpha);
        ctx.translate(x, y);
        ctx.scale(scale, scale);
        ctx.font = `700 13px ${CHART_MONO_FONT}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = popup.positive ? getCssVar('--green') : getCssVar('--red');
        ctx.fillText(popup.text, 0, 0);
        ctx.restore();
    });
    ctx.globalAlpha = 1;

    trade.flyingPopups = trade.flyingPopups.filter(p => !p.merged);
}

// Добавляет значение поглощённой цифры к большому итогу, пульсирует табло
// и проигрывает звук — всё это ровно в момент "прилёта" цифры.
function mergePopupIntoTotal(trade, delta) {
    trade.displayedTotal = round2(trade.displayedTotal + delta);
    updatePnlPanel(trade);
    pulsePnlAmount();
    playMergeSound(delta >= 0);
}

function updatePnlPanel(trade) {
    const amountEl = document.getElementById('tradePnlAmount');
    const percentEl = document.getElementById('tradePnlPercent');
    if (!amountEl || !percentEl) return;

    const positive = trade.displayedTotal >= 0;
    amountEl.textContent = formatSignedMoney(trade.displayedTotal);
    amountEl.classList.toggle('positive', positive);
    amountEl.classList.toggle('negative', !positive);

    const pct = trade.amount > 0 ? (trade.displayedTotal / trade.amount) * 100 : 0;
    const pctSign = pct >= 0 ? '+' : '';
    percentEl.textContent = `${pctSign}${pct.toFixed(0)}%`;
    percentEl.classList.toggle('positive', positive);
    percentEl.classList.toggle('negative', !positive);
}

function pulsePnlAmount() {
    const amountEl = document.getElementById('tradePnlAmount');
    if (!amountEl) return;
    amountEl.classList.remove('pulse');
    void amountEl.offsetWidth; // форсируем reflow, чтобы анимация точно перезапустилась
    amountEl.classList.add('pulse');
}

function getCssVar(name) {
    return getComputedStyle(document.body).getPropertyValue(name).trim() || '#888';
}

/* ---- Цикл анимации сделки (единый requestAnimationFrame, без таймеров) ---- */

// Путь сделки состоит из TRADE_CANDLES свечей, идущих одна за другой —
// каждая "дорисовывается" на своём отрезке времени, а не всё за одну свечу.
function updateGrowingPath(trade, totalProgress) {
    const growT = clamp01(totalProgress / TRADE_GROW_END);
    const segment = 1 / trade.pathCandles.length;
    let prevClose = trade.entryPrice;

    for (let i = 0; i < trade.pathCandles.length; i++) {
        const segStart = i * segment;
        const segEnd = segStart + segment;
        const localT = clamp01((growT - segStart) / segment);
        const eased = 1 - Math.pow(1 - localT, 3);

        const target = trade.pathCandles[i];
        const candleIndex = trade.entryIndex + 1 + i;
        const candle = marketCandles[candleIndex];
        if (candle) {
            candle.o = prevClose;
            candle.c = prevClose + (target.c - prevClose) * eased;
            candle.h = prevClose + (target.h - prevClose) * eased;
            candle.l = prevClose + (target.l - prevClose) * eased;
            candle.v = target.v * eased;

            // как только эта свеча только что "дорисовалась" впервые — рождаем
            // летящую цифру приращения к текущему итогу
            if (localT >= 0.999 && !trade.tickFired[i]) {
                trade.tickFired[i] = true;
                spawnTickPopup(trade, candleIndex, target.c);
            }
        }
        prevClose = target.c;
    }

    if (!trade.revealed && totalProgress >= TRADE_GROW_END) {
        revealTradeResult(trade);
    }
}

// Рождает летящую цифру-приращение (не полный текущий итог, а именно дельту
// с прошлого тика) в точке свечи на графике и нацеливает её на большое табло
// внизу экрана.
function spawnTickPopup(trade, candleIndex, priceAtTick) {
    const canvas = document.getElementById('marketCanvas');
    if (!canvas) return;
    const cssWidth = canvas.clientWidth || 320;
    const cssHeight = canvas.clientHeight || 180;
    const geo = computeChartGeometry(cssWidth, cssHeight);
    const cam = getChartCameraTransform(geo);

    const dataX = indexToX(candleIndex, geo);
    const dataY = priceToY(priceAtTick, geo) - 10;
    const startScreen = projectToScreen(dataX, dataY, cam);

    const favorable = trade.direction === 'up'
        ? (priceAtTick - trade.entryPrice)
        : (trade.entryPrice - priceAtTick);
    const movePercent = (favorable / trade.entryPrice) * 100;
    const newTotal = estimateNetChange(trade.amount, movePercent);
    const delta = round2(newTotal - trade.lockedNet);
    trade.lockedNet = newTotal;

    trade.flyingPopups.push({
        startX: startScreen.x,
        startY: clampScreenY(startScreen.y, cssHeight),
        targetX: cssWidth / 2,
        targetY: cssHeight - 8,
        delta: delta,
        text: formatSignedMoney(delta),
        positive: delta >= 0,
        bornAt: performance.now(),
        merged: false
    });
}

function runTradeAnimation() {
    const trade = state.activeTrade;
    if (!trade) return;

    if (tradeAnimFrameId) {
        cancelAnimationFrame(tradeAnimFrameId);
        tradeAnimFrameId = null;
    }

    function frame(now) {
        const elapsed = now - trade.animStartTime;
        const totalProgress = Math.min(elapsed / trade.durationMs, 1);
        trade.animProgress = totalProgress;

        updateGrowingPath(trade, totalProgress);
        drawMarketChart();

        // Дожидаемся, пока все летящие цифры долетят и поглотятся, даже если
        // формальное время анимации уже вышло — иначе табло может "потерять"
        // последний тик.
        const stillFlying = trade.flyingPopups.length > 0;

        if (totalProgress < 1 || stillFlying) {
            tradeAnimFrameId = requestAnimationFrame(frame);
        } else {
            tradeAnimFrameId = null;
            finishTradeAnimation();
        }
    }

    tradeAnimFrameId = requestAnimationFrame(frame);
}

function finishTradeAnimation() {
    state.activeTrade = null;
    document.getElementById('chartBox').classList.remove('fullscreen');
    drawMarketChart();
    state.tradeInProgress = false;
    const amt = getEnteredAmount();
    document.getElementById('upButton').disabled = amt <= 0;
    document.getElementById('downButton').disabled = amt <= 0;
}

function switchTab(pageId, evt) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    if (evt && evt.currentTarget) evt.currentTarget.classList.add('active');
    if (pageId === 'history-page') renderHistory();
    hideNotice();
}

function renderBalance() {
    const el = document.getElementById('globalBalance');
    const formatted = formatMoney(state.balance);
    el.textContent = formatted;
    el.classList.toggle('negative', state.balance < 0);

    const sub = document.getElementById('accountSub');
    sub.textContent = state.balance < 0
        ? 'Статус: маржинальное требование не исполнено'
        : 'Статус: активен';

    document.getElementById('recapButton').style.display = state.balance <= 0 ? 'block' : 'none';
}

function adjustBalance(delta) {
    state.balance = round2(state.balance + delta);
    persistBalance();
    renderBalance();
}

function formatMoney(value) {
    const sign = value < 0 ? '-' : '';
    return sign + '$' + Math.abs(value).toLocaleString('en-US', { maximumFractionDigits: 2, minimumFractionDigits: 0 });
}

function formatSignedMoney(value) {
    const sign = value >= 0 ? '+' : '-';
    return sign + '$' + Math.abs(value).toLocaleString('en-US', { maximumFractionDigits: 2, minimumFractionDigits: 0 });
}

function round2(value) {
    return Math.round(value * 100) / 100;
}

/* =========================================================
   ТРЕЙДИНГОВАЯ СДЕЛКА ВВЕРХ / ВНИЗ — ПРОПОРЦИОНАЛЬНЫЙ РЕЗУЛЬТАТ
   ========================================================= */

// Чем дальше цена прошла в выбранную сторону — тем больше прибыль, без
// верхнего предела кроме потолка в MAX_WIN_MULTIPLE (x4, то есть +400%).
// Чем дальше против — тем больше теряется от ставки, но не больше 100% —
// потерять можно максимум ровно то, что вложено, и ни центом больше.
// movePercent — движение цены В ПОЛЬЗУ направления сделки (отрицательное
// значит движение против направления ставки).
function estimateNetChange(amount, movePercent) {
    if (movePercent >= 0) {
        const multiple = Math.min(movePercent / MOVE_SCALE_PERCENT, MAX_WIN_MULTIPLE);
        return round2(amount * multiple);
    } else {
        const against = Math.abs(movePercent);
        const fraction = MIN_LOSS_FRACTION + (1 - MIN_LOSS_FRACTION) * clamp01(against / MOVE_SCALE_PERCENT);
        return round2(-amount * fraction); // fraction максимум 1.0 => максимум -100% от ставки
    }
}

// Считаем, насколько можно приблизиться, не обрезав путь сделки: чем шире
// размах цены за время сделки, тем меньше приближение (вплоть до обычного
// вида ленты), чтобы верх/низ пути всегда оставались с запасом от краёв.
function computeTradeZoomTarget(entryPrice, pathCandles, geo) {
    let hi = entryPrice, lo = entryPrice;
    pathCandles.forEach(c => {
        if (c.h > hi) hi = c.h;
        if (c.l < lo) lo = c.l;
    });
    const pathRange = Math.max(hi - lo, 0.01);
    const raw = (ZOOM_SAFE_FRACTION * geo.priceRange) / pathRange;
    return Math.max(ZOOM_FLOOR, Math.min(MAX_ZOOM, raw));
}

function bindDirectionButtons() {
    document.getElementById('upButton').addEventListener('click', () => placeTrade('up'));
    document.getElementById('downButton').addEventListener('click', () => placeTrade('down'));
}

function placeTrade(direction) {
    try {
        if (state.tradeInProgress) return;
        const amount = getEnteredAmount();
        if (amount <= 0) {
            showNotice('Укажите сумму инвестиции', false);
            return;
        }
        if (amount > state.balance) {
            showNotice('Недостаточно средств на счёте для этой сделки', false);
            return;
        }

        state.tradeInProgress = true;
        document.getElementById('upButton').disabled = true;
        document.getElementById('downButton').disabled = true;

        const entryPrice = marketCandles[marketCandles.length - 1].c;

        // Весь путь цены на время сделки считается один раз, сразу, тем же
        // процессом случайного блуждания, что рисует ленту — дальше это
        // только красиво показываем: свечи "дорисовываются" одна за другой
        // от точки входа до уже известного финала.
        const pathCandles = [];
        let cursor = entryPrice;
        for (let i = 0; i < TRADE_CANDLES; i++) {
            const c = buildNextCandle(cursor);
            pathCandles.push(c);
            cursor = c.c;
        }
        const finalPrice = pathCandles[pathCandles.length - 1].c;

        const favorableMove = direction === 'up'
            ? (finalPrice - entryPrice)
            : (entryPrice - finalPrice);
        const movePercent = (favorableMove / entryPrice) * 100;
        const netChange = estimateNetChange(amount, movePercent);
        const won = netChange >= 0;

        const canvasEl = document.getElementById('marketCanvas');
        const preGeo = computeChartGeometry(canvasEl.clientWidth || 320, canvasEl.clientHeight || 180);
        const zoomTarget = computeTradeZoomTarget(entryPrice, pathCandles, preGeo);

        document.getElementById('chartBox').classList.add('fullscreen');

        adjustBalance(-amount); // ставка списывается сразу при входе в сделку

        for (let i = 0; i < TRADE_CANDLES; i++) {
            const growingCandle = { o: entryPrice, h: entryPrice, l: entryPrice, c: entryPrice, v: 0 };
            marketCandles.push(growingCandle);
        }
        while (marketCandles.length > 34) marketCandles.shift();

        const expiryIndex = marketCandles.length - 1;
        const entryIndex = expiryIndex - TRADE_CANDLES;

        state.activeTrade = {
            entryIndex: entryIndex,
            expiryIndex: expiryIndex,
            entryPrice: entryPrice,
            direction: direction,
            pathCandles: pathCandles,
            tickFired: new Array(TRADE_CANDLES).fill(false),
            flyingPopups: [],
            lockedNet: 0,
            displayedTotal: 0,
            won: won,
            netChange: netChange,
            amount: amount,
            revealed: false,
            result: null,
            animProgress: 0,
            animStartTime: performance.now(),
            durationMs: randomBetween(TRADE_MIN_MS, TRADE_MAX_MS),
            zoomTarget: zoomTarget
        };

        updatePnlPanel(state.activeTrade); // сразу показываем табло с нулём, без задержки

        runTradeAnimation();
    } catch (err) {
        console.error('Ошибка открытия сделки:', err);
        showNotice('Ошибка исполнения ордера', false);
        state.tradeInProgress = false;
    }
}

// Раскрытие результата: срабатывает один раз, ровно в момент, когда путь
// цены дорисовался до финального значения — баланс/история/уведомление
// синхронизированы с тем, что видно на графике.
function revealTradeResult(trade) {
    trade.revealed = true;
    trade.result = trade.won ? 'win' : 'lose';

    if (trade.netChange !== 0) {
        adjustBalance(trade.netChange);
    }
    addHistoryEntry(trade.direction, trade.amount, trade.netChange);

    const arrow = trade.direction === 'up' ? '▲' : '▼';
    if (trade.result === 'win') {
        showNotice(`${arrow} Сделка закрыта в плюс: ${formatSignedMoney(trade.netChange)}`, true);
    } else {
        showNotice(`${arrow} Сделка закрыта в минус: ${formatSignedMoney(trade.netChange)}`, false);
    }
}

/* =========================================================
   ИСТОРИЯ ОПЕРАЦИЙ
   ========================================================= */

function addHistoryEntry(direction, amount, netChange) {
    state.history.unshift({
        direction: direction,
        amount: amount,
        profit: netChange,
        timestamp: Date.now()
    });
    if (state.history.length > MAX_HISTORY_ITEMS) {
        state.history.length = MAX_HISTORY_ITEMS;
    }
    persistHistory();
    if (document.getElementById('history-page').classList.contains('active')) {
        renderHistory();
    }
}

function renderHistory() {
    const list = document.getElementById('historyList');
    if (!list) return;
    list.innerHTML = '';

    if (state.history.length === 0) {
        list.innerHTML = '<div class="empty-history">Операций пока нет</div>';
        return;
    }

    state.history.forEach(entry => {
        const row = document.createElement('div');
        row.className = 'history-item';

        const left = document.createElement('div');
        left.className = 'history-left';

        const icon = document.createElement('div');
        icon.className = 'history-icon';
        icon.textContent = entry.direction === 'up' ? '▲' : '▼';

        const meta = document.createElement('div');
        meta.className = 'history-meta';

        const tickerEl = document.createElement('div');
        tickerEl.className = 'history-ticker';
        tickerEl.textContent = `${entry.direction === 'up' ? 'Вверх' : 'Вниз'} · ${formatMoney(entry.amount)}`;

        const timeEl = document.createElement('div');
        timeEl.className = 'history-time';
        timeEl.textContent = new Date(entry.timestamp).toLocaleString(undefined, {
            day: '2-digit', month: '2-digit',
            hour: '2-digit', minute: '2-digit'
        });

        meta.append(tickerEl, timeEl);
        left.append(icon, meta);

        const amountEl = document.createElement('div');
        const isPositive = entry.profit >= 0;
        amountEl.className = `history-amount ${isPositive ? 'pos' : 'neg'}`;
        amountEl.textContent = formatSignedMoney(entry.profit);

        row.append(left, amountEl);
        list.appendChild(row);
    });
}

/* =========================================================
   ПРОЧИЕ КНОПКИ
   ========================================================= */

function bindStaticButtons() {
    document.getElementById('recapButton').addEventListener('click', executeRecapitalization);
}

function executeRecapitalization() {
    try {
        if (state.balance > 0) return;
        adjustBalance(100);
        showNotice('Экстренная докапитализация счёта: +$100', true);
    } catch (err) {
        console.error('Ошибка докапитализации счёта:', err);
    }
}

let noticeTimer = null;

function showNotice(message, isPositive) {
    const el = document.getElementById('noticeBox');
    el.textContent = message;
    el.className = `notice ${isPositive ? 'win' : 'lose'}`;
    el.style.display = 'block';
    if (noticeTimer) clearTimeout(noticeTimer);
    noticeTimer = setTimeout(hideNotice, 4500);
}

function hideNotice() {
    document.getElementById('noticeBox').style.display = 'none';
}

document.addEventListener('DOMContentLoaded', init);
</script>
