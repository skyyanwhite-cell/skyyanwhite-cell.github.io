<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terminal de Trading</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    :root{
        --bg: var(--tg-theme-bg-color, #0A0D12);
        --surface: var(--tg-theme-secondary-bg-color, #141922);
        --surface-2: #1B212C;
        --border: rgba(201,169,97,0.16);
        --gold: #C9A961;
        --gold-bright: #E8C874;
        --green: #1FAE64;
        --red: #E5484D;
        --text: var(--tg-theme-text-color, #E8E9ED);
        --text-dim: var(--tg-theme-hint-color, #838C9C);
        --mono: 'SF Mono', 'Roboto Mono', 'Consolas', monospace;
    }
    *{ box-sizing: border-box; }
    body{
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        margin: 0; padding: 14px;
        color: var(--text);
        background: var(--bg);
        user-select: none;
        display: flex; flex-direction: column; 
        height: 100vh; height: 100dvh; overflow: hidden;
    }
    .container{ max-width: 100%; margin: 0 auto; width: 100%; flex: 1; display: flex; flex-direction: column; min-height: 0; }

    /* Boot Loader */
    .boot-loader {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: #0A0D12; z-index: 9999; display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    .boot-loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .boot-logo {
        font-size: 52px; font-weight: 800; letter-spacing: 1px;
        background: linear-gradient(135deg, #E8C874, #C9A961, #8A6D3B);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        animation: logo-pulse 2s infinite alternate; margin-bottom: 20px;
    }
    .boot-logo span { font-size: 64px; }
    .boot-spinner {
        width: 40px; height: 40px; border: 3px solid rgba(201,169,97,0.2);
        border-top-color: var(--gold-bright); border-radius: 50%;
        animation: spin 1s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes logo-pulse { 0% { filter: drop-shadow(0 0 10px rgba(232,200,116,0.2)); } 100% { filter: drop-shadow(0 0 25px rgba(232,200,116,0.6)); } }

    /* Skeleton Loading */
    .skeleton {
        color: transparent !important; background: linear-gradient(90deg, #1B212C 25%, #252D3D 50%, #1B212C 75%);
        background-size: 200% 100%; animation: skeleton-loading 1.5s infinite;
        border-radius: 6px; display: inline-block; min-width: 80px;
    }
    @keyframes skeleton-loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    .ticker-wrap{
        overflow: hidden; background: var(--surface); border: 1px solid var(--border);
        border-radius: 8px; margin-bottom: 14px; padding: 8px 0; flex-shrink: 0;
    }
    .ticker-track{ display: flex; white-space: nowrap; animation: scroll-left 180s linear infinite; }
    .ticker-item{ font-family: var(--mono); font-size: 12px; padding: 0 16px; border-right: 1px solid var(--border); color: var(--text-dim); letter-spacing: 0.2px; }
    .ticker-item b{ color: var(--text); font-weight: 600; }
    .t-up{ color: var(--green); }
    .t-down{ color: var(--red); }
    @keyframes scroll-left{ 0%{ transform: translateX(0); } 100%{ transform: translateX(-50%); } }

    .tabs{ display: flex; gap: 8px; margin-bottom: 14px; flex-shrink: 0;}
    .tab-btn{
        flex: 1; background: var(--surface); color: var(--text-dim); border: 1px solid var(--border);
        padding: 11px 6px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px;
        letter-spacing: 0.2px; transition: all .15s ease;
    }
    .tab-btn.active{ background: linear-gradient(135deg, var(--gold), #A9853F); color: #14110A; border-color: transparent; }
    
    .page{ display: none; flex: 1; flex-direction: column; min-height: 0; }
    .page.active{ display: flex; }
    #history-page { overflow-y: auto; padding-bottom: 10px; } 

    .account-card{
        display: flex; align-items: center; justify-content: space-between; gap: 10px;
        background: linear-gradient(160deg, var(--surface-2), var(--surface)); border: 1px solid var(--border);
        padding: 12px 14px; border-radius: 14px; margin-bottom: 10px; position: relative; overflow: hidden; flex-shrink: 0;
    }
    .account-card::before{
        content: ""; position: absolute; top: -30%; right: -20%; width: 160px; height: 160px;
        background: radial-gradient(circle, rgba(201,169,97,0.15), transparent 70%); z-index: 1;
    }
    .account-left { flex: 1; min-width: 0; z-index: 2; }
    .account-right { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; z-index: 2; width: 105px; }
    
    .account-label{ font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); margin-bottom: 4px; }
    .account-amount{ font-family: var(--mono); font-size: 26px; font-weight: 700; color: var(--gold-bright); letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .account-amount.negative{ color: var(--red); }
    .account-sub{ font-size: 10px; color: var(--text-dim); margin-top: 4px; }
    
    @keyframes pulse-gold-border { 
        0% { box-shadow: 0 0 5px rgba(201,169,97,0.3); border-color: rgba(201,169,97,0.5); } 
        50% { box-shadow: 0 0 15px rgba(201,169,97,0.8); border-color: rgba(232,200,116,1); } 
        100% { box-shadow: 0 0 5px rgba(201,169,97,0.3); border-color: rgba(201,169,97,0.5); } 
    }

    .action-btn {
        background: rgba(201,169,97,0.15); border: 1px solid var(--gold); color: var(--gold-bright);
        padding: 7px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; font-family: var(--mono);
        cursor: pointer; transition: all 0.2s; text-align: center;
        animation: pulse-gold-border 2.5s infinite;
    }
    .action-btn:active { background: rgba(201,169,97,0.3); transform: scale(0.95); }

    .wager-wrap {
        background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
        padding: 10px 14px; margin-bottom: 14px; flex-shrink: 0;
    }
    .wager-header {
        display: flex; justify-content: space-between; align-items: center;
        font-size: 10px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px;
        letter-spacing: 0.5px; font-weight: 600;
    }
    .wager-val { font-family: var(--mono); color: var(--text); font-size: 11px; }
    .wager-track {
        height: 6px; background: rgba(0,0,0,0.3); border-radius: 4px; overflow: hidden; position: relative;
    }
    
    @keyframes pulse-gold { 
        0% { box-shadow: 0 0 5px rgba(201,169,97,0.4); } 
        50% { box-shadow: 0 0 15px rgba(201,169,97,0.8); } 
        100% { box-shadow: 0 0 5px rgba(201,169,97,0.4); } 
    }

    .wager-fill {
        height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-bright));
        width: 0%; transition: width 0.4s ease; border-radius: 4px; 
        animation: pulse-gold 2s infinite;
    }

    .amount-box{
        background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
        padding: 14px; margin-bottom: 12px; flex-shrink: 0;
    }
    .amount-label{ font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-dim); margin-bottom: 8px; }
    .amount-input-row{ display: flex; align-items: center; gap: 8px; }
    .amount-currency{ font-family: var(--mono); font-size: 20px; color: var(--gold-bright); font-weight: 700; }
    .amount-input{
        flex: 1; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
        padding: 10px 10px; font-family: var(--mono); font-size: 18px; font-weight: 700; color: var(--text); outline: none; min-width: 0;
        transition: border-color 0.2s ease;
    }
    .amount-input:focus{ border-color: var(--gold); }
    .quick-amounts{ display: flex; gap: 4px; margin-top: 10px; flex-wrap: wrap; }
    .quick-chip{
        flex: 1; min-width: 45px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
        padding: 7px 2px; text-align: center; font-family: var(--mono); font-size: 11.5px; color: var(--text-dim); cursor: pointer;
        transition: all 0.2s ease;
    }
    .quick-chip.active{ border-color: var(--gold); color: var(--gold-bright); animation: pulse-gold-border 1.5s infinite; }

    @keyframes pulse-green { 0%{box-shadow: 0 0 10px rgba(31, 174, 100, 0.4);} 50%{box-shadow: 0 0 25px rgba(31, 174, 100, 0.85);} 100%{box-shadow: 0 0 10px rgba(31, 174, 100, 0.4);} }
    @keyframes pulse-red { 0%{box-shadow: 0 0 10px rgba(229, 72, 77, 0.4);} 50%{box-shadow: 0 0 25px rgba(229, 72, 77, 0.85);} 100%{box-shadow: 0 0 10px rgba(229, 72, 77, 0.4);} }

    .direction-row{ display: flex; gap: 10px; margin-bottom: 12px; flex-shrink: 0; }
    .direction-btn{
        flex: 1; border: none; border-radius: 10px; padding: 13px 8px; font-size: 18px; font-weight: 800; text-transform: uppercase;
        cursor: pointer; letter-spacing: 1px; display: flex; flex-direction: row; align-items: center; justify-content: center; transition: transform .1s ease;
        color: #FFFFFF; text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    }
    .direction-btn:active{ transform: scale(0.96); }
    .direction-btn.up{ background: radial-gradient(ellipse at center, #32EA8F 0%, #158F4E 100%); border: 2px solid #4ade80; animation: pulse-green 1.8s infinite; }
    .direction-btn.down{ background: radial-gradient(ellipse at center, #FF6B6B 0%, #B82328 100%); border: 2px solid #f87171; animation: pulse-red 1.8s infinite; }
    .direction-btn:disabled{ opacity: 0.4; cursor: not-allowed; transform: none; animation: none; border-color: transparent; }

    .chart-box{
        background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
        padding: 10px 8px; margin-bottom: 0px; overflow: hidden; position: relative; z-index: 1; transition: all .38s cubic-bezier(.22,.9,.3,1);
        display: flex; flex-direction: column; flex: 1 1 0%; min-height: 0;
    }
    .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding: 0 4px; flex-shrink: 0; }
    .chart-label { margin-bottom: 0; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-dim); }
    
    .asset-selector {
        display: flex; align-items: center; gap: 6px; cursor: pointer;
        background: var(--surface-2); padding: 4px 10px; border-radius: 6px;
        font-family: var(--mono); font-weight: 700; font-size: 14px; border: 1px solid var(--border);
        color: var(--gold-bright); transition: background 0.2s;
    }
    .asset-selector:active { background: var(--surface); }
    .asset-selector .arrow { font-size: 10px; color: var(--text-dim); }
    
    .asset-dropdown {
        position: absolute; top: 44px; left: 10px; background: var(--surface-2); border: 1px solid var(--border);
        border-radius: 8px; width: 220px; max-height: 240px; overflow-y: auto; z-index: 1000;
        display: none; flex-direction: column; box-shadow: 0 4px 16px rgba(0,0,0,0.6);
    }
    .asset-dropdown.show { display: flex; }
    .asset-item {
        display: flex; justify-content: space-between; align-items: center; padding: 12px 14px;
        border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer;
    }
    .asset-item:hover { background: var(--surface); }
    .asset-info { display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 14px; font-weight: 700; color: #fff;}
    .asset-pct { font-size: 12px; font-weight: 600;}
    .asset-pct.pos { color: var(--green); }
    .asset-pct.neg { color: var(--red); }
    .asset-star { color: #444; font-size: 20px; cursor: pointer; transition: all 0.2s; user-select: none; line-height: 1; margin-top: -2px; }
    .asset-star.fav { color: var(--gold-bright); text-shadow: 0 0 10px rgba(232,200,116,0.5); }
    .asset-dropdown::-webkit-scrollbar { width: 4px; }
    .asset-dropdown::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

    .chart-box.fullscreen{
        position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100vw; height: 100vh;
        max-width: none; margin: 0; border-radius: 0; z-index: 600; display: flex; flex-direction: column; padding: 16px 10px;
    }
    
    #marketCanvas{ width: 100%; flex: 1 1 auto; display: block; min-height: 120px; }

    .trade-pnl-panel{ display: none; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px 0 2px; flex-shrink: 0; }
    .chart-box.fullscreen .trade-pnl-panel{ display: flex; }
    .trade-pnl-percent{ font-family: var(--mono); font-size: 15px; font-weight: 700; letter-spacing: 0.3px; color: var(--text-dim); }
    .trade-pnl-percent.positive{ color: var(--green); }
    .trade-pnl-percent.negative{ color: var(--red); }
    .trade-pnl-amount{ font-family: var(--mono); font-size: clamp(28px, 9vw, 44px); font-weight: 800; letter-spacing: 0.5px; color: var(--text); transition: color .15s ease; }
    .trade-pnl-amount.positive{ color: var(--green); text-shadow: 0 0 18px rgba(31,174,100,0.55); }
    .trade-pnl-amount.negative{ color: var(--red); text-shadow: 0 0 18px rgba(229,72,77,0.5); }
    .trade-pnl-amount.pulse{ animation: pnlPulse .32s ease; }
    @keyframes pnlPulse{ 0%{ transform: scale(1); } 35%{ transform: scale(1.18); } 100%{ transform: scale(1); } }

    .history-page .history-list{ display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    
    .history-item{ 
        display: flex; justify-content: space-between; align-items: center; 
        background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; 
        transition: all 0.3s ease;
    }
    .history-item.win { border-color: rgba(31,174,100,0.3); box-shadow: 0 0 12px rgba(31,174,100,0.08); }
    .history-item.jackpot { border-color: rgba(232,200,116,0.4); box-shadow: 0 0 16px rgba(232,200,116,0.15); }
    .history-item.lose { opacity: 0.65; transform: scale(0.96); padding: 8px 12px; }

    .history-left{ display: flex; align-items: center; gap: 9px; min-width: 0; }
    .history-icon{ font-size: 19px; flex-shrink: 0; }
    .history-meta{ display: flex; flex-direction: column; min-width: 0; }
    .history-ticker{ font-family: var(--mono); font-weight: 700; font-size: 12.5px; color: var(--text); }
    .history-time{ font-size: 10px; color: var(--text-dim); margin-top: 1px; }
    
    .history-amount-wrap { display: flex; align-items: center; gap: 6px; }
    .history-amount{ font-family: var(--mono); font-weight: 700; font-size: 13px; white-space: nowrap; }
    
    .history-amount.win { color: #2BD881; font-size: 16px; text-shadow: 0 0 10px rgba(43,216,129,0.4); animation: historyBlink 2s infinite; }
    .history-amount.jackpot { color: var(--gold-bright); font-size: 19px; text-shadow: 0 0 14px rgba(232,200,116,0.6); animation: historyBlink 1.5s infinite; }
    .history-amount.lose { color: var(--text-dim); font-size: 12px; font-weight: 500; }

    .history-pct { font-size: 10px; padding: 2px 4px; border-radius: 4px; font-weight: 800; letter-spacing: 0.5px; font-family: var(--mono); }
    .history-pct.win { background: rgba(31,174,100,0.15); color: #2BD881; }
    .history-pct.jackpot { background: rgba(232,200,116,0.15); color: var(--gold-bright); }

    @keyframes historyBlink { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

    .empty-history{ text-align: center; color: var(--text-dim); font-size: 12px; padding: 20px 0; }

    /* Overlay Notifications */
    .notice-overlay {
        position: absolute; top: 0; left: 0; right: 0; bottom: 0;
        display: none; align-items: center; justify-content: center;
        pointer-events: none; z-index: 20; background: rgba(10, 13, 18, 0.6);
        border-radius: 12px; backdrop-filter: blur(2px);
    }
    .notice-msg {
        border-radius: 16px; text-align: center; font-family: var(--mono); font-weight: 800; letter-spacing: 0.5px;
        animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    .notice-msg.win { color: #2BD881; font-size: clamp(32px, 8vw, 42px); text-shadow: 0 0 20px rgba(43,216,129,0.8); border: 2px solid #2BD881; background: rgba(31,174,100,0.15); box-shadow: 0 0 40px rgba(31,174,100,0.5); width: 85%; padding: 25px; }
    .notice-msg.jackpot { color: var(--gold-bright); font-size: clamp(36px, 9vw, 48px); text-shadow: 0 0 25px rgba(232,200,116,0.9); border: 2px solid var(--gold-bright); background: rgba(232,200,116,0.15); box-shadow: 0 0 50px rgba(232,200,116,0.6); width: 90%; padding: 30px; }
    .notice-msg.lose { color: var(--text-dim); font-size: 16px; border: 1px solid rgba(131,140,156,0.3); background: rgba(20,25,34,0.9); padding: 12px 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    
    @keyframes popIn { 0%{transform: scale(0.5); opacity: 0;} 100%{transform: scale(1); opacity: 1;} }

    @media (max-height: 720px) {
        body { padding: 8px 10px; }
        .ticker-wrap { margin-bottom: 8px; padding: 5px 0; }
        .tabs { margin-bottom: 8px; }
        .account-card { padding: 8px 12px; margin-bottom: 8px; }
        .wager-wrap { padding: 6px 12px; margin-bottom: 8px; }
        .amount-box { padding: 8px 12px; margin-bottom: 8px; }
        .direction-row { margin-bottom: 8px; }
        .direction-btn { padding: 10px 8px; font-size: 16px; }
        .chart-box { padding: 6px; margin-bottom: 8px; }
        #marketCanvas { height: 130px; }
        .account-amount { font-size: 20px; }
        .amount-input { font-size: 16px; padding: 6px; }
        .quick-amounts { margin-top: 6px; }
        .quick-chip { padding: 5px 2px; font-size: 10.5px; }
    }
</style>
</head>
<body>
<div id="bootLoader" class="boot-loader">
    <div class="boot-logo">Profit<span>X</span></div>
    <div class="boot-spinner"></div>
</div>

<div class="container">
    <div class="ticker-wrap"><div class="ticker-track" id="tickerTrack"></div></div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('trade-page', event)">Trading</button>
        <button class="tab-btn" onclick="switchTab('history-page', event)">Historial</button>
    </div>

    <div class="account-card">
        <div class="account-left">
            <div class="account-label">Cuenta de Trading</div>
            <div class="account-amount skeleton" id="globalBalance">0.00</div>
            <div class="account-sub" id="accountSub">Estado: Activo</div>
        </div>
        <div class="account-right">
            <button class="action-btn" onclick="triggerBotAction('deposit')">Depositar</button>
            <button class="action-btn" onclick="triggerBotAction('withdraw')">Retirar</button>
        </div>
    </div>

    <div class="wager-wrap">
        <div class="wager-header">
            <span>Volumen de trading</span>
            <span class="wager-val skeleton" id="wagerText">$0 / $0 (0%)</span>
        </div>
        <div class="wager-track">
            <div class="wager-fill" id="wagerFill"></div>
        </div>
    </div>

    <div id="trade-page" class="page active">
        <div class="amount-box">
            <div class="amount-label">Monto de inversión</div>
            <div class="amount-input-row">
                <span class="amount-currency" id="currencySymbolUi">$</span>
                <input type="text" inputmode="decimal" class="amount-input" id="amountInput" placeholder="0">
            </div>
            <div class="quick-amounts" id="quickAmountsContainer">
                <div class="quick-chip" data-percent="5">5%</div>
                <div class="quick-chip" data-percent="10">10%</div>
                <div class="quick-chip" data-percent="25">25%</div>
                <div class="quick-chip" data-percent="50">50%</div>
                <div class="quick-chip" data-percent="75">75%</div>
                <div class="quick-chip" data-percent="MAX">MAX</div>
            </div>
        </div>

        <div class="direction-row">
            <button class="direction-btn up" id="upButton" disabled>Sube</button>
            <button class="direction-btn down" id="downButton" disabled>Baja</button>
        </div>

        <div class="chart-box" id="chartBox">
            <div class="chart-header">
                <div class="asset-selector" onclick="toggleAssetDropdown()">
                    <span id="currentAssetLabel">SOL</span> <span class="arrow">▼</span>
                </div>
                <div class="chart-label">Precio y volumen</div>
            </div>
            
            <div class="asset-dropdown" id="assetDropdown"></div>
            <canvas id="marketCanvas"></canvas>
            <div class="trade-pnl-panel" id="tradePnlPanel">
                <div class="trade-pnl-percent" id="tradePnlPercent">+0%</div>
                <div class="trade-pnl-amount" id="tradePnlAmount">+0</div>
            </div>
            <div class="notice-overlay" id="noticeOverlay">
                <div class="notice-msg" id="noticeMsg"></div>
            </div>
        </div>
    </div>

    <div id="history-page" class="page history-page">
        <div class="history-list" id="historyList"></div>
    </div>
</div>

<script>
"use strict";

const TICKER_SYMBOLS = [
    'BTC','ETH','TON','SOL','BNB','XRP','DOGE','ADA','TRX','AVAX',
    'LINK','DOT','MATIC','LTC','BCH','AAPL','TSLA','NVDA','MSFT','AMZN',
    'GOOGL','META','NFLX','SPX','NDX'
];
const ASSET_PRICES = {
    BTC: 64200, ETH: 3105, TON: 5.8, SOL: 144, BNB: 592, XRP: 0.52, DOGE: 0.12, ADA: 0.45, TRX: 0.11, AVAX: 35,
    LINK: 14, DOT: 6.2, MATIC: 0.65, LTC: 82, BCH: 380, AAPL: 188, TSLA: 212, NVDA: 115, MSFT: 420, AMZN: 185,
    GOOGL: 175, META: 480, NFLX: 620, SPX: 5420, NDX: 18500
};

const STORAGE_KEY_REAL = 'tt_real_balance';
const STORAGE_KEY_BONUS = 'tt_bonus_balance';
const STORAGE_KEY_HISTORY = 'tt_trade_history';
const MAX_HISTORY_ITEMS = 60;

const BASE_URL = 'https://shrimp-tactful-tricycle.ngrok-free.dev';
const SYNC_INTERVAL_MS = 8000;
const SYNC_DEBOUNCE_MS = 1200;

let audioCtx = null;
function ensureAudioContext() {
    if (!audioCtx) {
        try { const AC = window.AudioContext || window.webkitAudioContext; audioCtx = new AC(); }
        catch (err) { return null; }
    }
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    return audioCtx;
    }

// Кастомная система тактильной отдачи с дублером для Android
function triggerHaptic(style = 'medium') {
    if (state.tg && state.tg.HapticFeedback) {
        state.tg.HapticFeedback.impactOccurred(style);
    }
    // Дублер для Android
    if (navigator.vibrate) {
        if (style === 'light') navigator.vibrate(15);
        else if (style === 'medium') navigator.vibrate(30);
        else navigator.vibrate(50); // heavy
    }
}

function triggerNotificationHaptic(type = 'success') {
    if (state.tg && state.tg.HapticFeedback) {
        state.tg.HapticFeedback.notificationOccurred(type);
    }
    // Дублер для Android
    if (navigator.vibrate) {
        if (type === 'success') navigator.vibrate([30, 60, 30]); // Двойной удар
        else if (type === 'warning') navigator.vibrate([30, 60, 30, 60, 50]); // Тройной удар для джекпота
        else navigator.vibrate(60); // Одиночный для ошибки
    }
}

function playClickSound() {
    triggerHaptic('medium');
    try {
        const ctx = ensureAudioContext(); if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(720, now); osc.frequency.exponentialRampToValueAtTime(340, now + 0.06);
        gain.gain.setValueAtTime(0.18, now); gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);
        osc.connect(gain); gain.connect(ctx.destination); osc.start(now); osc.stop(now + 0.09);
    } catch (err) {}
}

function playMergeSound(positive) {
    try {
        const ctx = ensureAudioContext(); if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.type = positive ? 'triangle' : 'sine';
        if (positive) { osc.frequency.setValueAtTime(520, now); osc.frequency.exponentialRampToValueAtTime(940, now + 0.09); }
        else { osc.frequency.setValueAtTime(340, now); osc.frequency.exponentialRampToValueAtTime(180, now + 0.14); }
        gain.gain.setValueAtTime(0.0001, now); gain.gain.exponentialRampToValueAtTime(0.22, now + 0.02); gain.gain.exponentialRampToValueAtTime(0.0001, now + (positive ? 0.16 : 0.2));
        osc.connect(gain); gain.connect(ctx.destination); osc.start(now); osc.stop(now + (positive ? 0.18 : 0.22));
    } catch (err) {}
}

    function playResultSound(type) {
    try {
        const ctx = ensureAudioContext(); if (!ctx) return;
        const now = ctx.currentTime;

        if (type === 'win') {
            // Торжественное восходящее арпеджио
            const notes = [523.25, 659.25, 783.99]; // Ноты C5, E5, G5
            notes.forEach((freq, i) => {
                const osc = ctx.createOscillator(); const gain = ctx.createGain();
                osc.type = 'triangle'; osc.frequency.value = freq;
                const startTime = now + i * 0.12;
                osc.connect(gain); gain.connect(ctx.destination);
                gain.gain.setValueAtTime(0, startTime);
                gain.gain.linearRampToValueAtTime(0.12, startTime + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.4);
                osc.start(startTime); osc.stop(startTime + 0.4);
            });
        } else if (type === 'jackpot') {
            // Грандиозная долгая фанфара
            const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51]; // C5, E5, G5, C6, E6
            notes.forEach((freq, i) => {
                const osc = ctx.createOscillator(); const gain = ctx.createGain();
                osc.type = 'triangle'; osc.frequency.value = freq;
                const startTime = now + i * 0.08;
                osc.connect(gain); gain.connect(ctx.destination);
                gain.gain.setValueAtTime(0, startTime);
                gain.gain.linearRampToValueAtTime(0.15, startTime + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.7);
                osc.start(startTime); osc.stop(startTime + 0.7);
            });
        } else {
            // Нейтральный, мягкий падающий звук проигрыша
            const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(261.63, now); // Начинаем с C4
            osc.frequency.exponentialRampToValueAtTime(130.81, now + 0.3); // Плавно падаем до C3
            osc.connect(gain); gain.connect(ctx.destination);
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.15, now + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            osc.start(now); osc.stop(now + 0.4);
        }
    } catch (e) {}
}

let syncDebounceTimer = null;
let syncInFlight = false;
let profileLoadInFlight = false;
let hasUnsyncedTrade = false; 

function getInitData() { return state.tg && state.tg.initData ? state.tg.initData : ''; }

async function triggerBotAction(action) {
    if (!state.userId) return;
    try {
        await fetch(`${BASE_URL}/api/action`, {
            method: 'POST', 
            headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
            body: JSON.stringify({ user_id: state.userId, action: action })
        });
    } catch (e) {}
    if (state.tg) state.tg.close();
}

let pollingTimer = null;
function startBackgroundPolling() {
    pollingTimer = setInterval(async () => {
        if (state.tradeInProgress || syncInFlight || profileLoadInFlight || hasUnsyncedTrade) return;
        if (!state.userId) return;
        try {
            const response = await fetch(`${BASE_URL}/api/get_profile?user_id=${encodeURIComponent(state.userId)}`, { headers: { 'ngrok-skip-browser-warning': 'true' } });
            if (response.status === 403) {
                clearInterval(pollingTimer);
                if (state.tg) state.tg.close(); 
                document.body.innerHTML = '<div style="display:flex; height:100vh; align-items:center; justify-content:center; color:var(--red); font-family:var(--mono); font-weight:bold; font-size:18px;">CONEXIÓN INTERRUMPIDA</div>';
                return;
            }
            if (!response.ok) return;
            const data = await response.json();
            if (data.status === 'success') {
                state.turnover = data.turnover !== undefined ? parseFloat(data.turnover) : state.turnover;
                state.requiredTrades = data.required_trades !== undefined ? parseFloat(data.required_trades) : state.requiredTrades;
                
                const sReal = parseFloat(data.real_balance);
                const sBonus = parseFloat(data.bonus_balance);
                if (Math.abs(state.realBalance - sReal) > 0.01 || Math.abs(state.bonusBalance - sBonus) > 0.01) {
                    state.realBalance = sReal; state.bonusBalance = sBonus;
                    renderBalance(); renderWager(); persistBalance({ skipSync: true });
                } else {
                    renderWager();
                }
            }
        } catch (err) {}
    }, 3000);
}

function removeSkeletons() {
    document.getElementById('globalBalance').classList.remove('skeleton');
    document.getElementById('wagerText').classList.remove('skeleton');
    document.getElementById('bootLoader').classList.add('hidden');
}

async function loadUserProfileFromServer() {
    if (!state.userId) { removeSkeletons(); return; }
    profileLoadInFlight = true;
    try {
        const response = await fetch(`${BASE_URL}/api/get_profile?user_id=${encodeURIComponent(state.userId)}`, { headers: { 'ngrok-skip-browser-warning': 'true' } });
        if (!response.ok) throw new Error('Status ' + response.status);
        const data = await response.json();
        if (data.status === 'success') {
            state.realBalance = parseFloat(data.real_balance) || 0;
            state.bonusBalance = parseFloat(data.bonus_balance) || 0;
            state.turnover = data.turnover !== undefined ? parseFloat(data.turnover) : 0;
            state.requiredTrades = data.required_trades !== undefined ? parseFloat(data.required_trades) : 0;
            state.profileLoaded = true;
            persistBalance({ skipSync: true });
        }
    } catch (err) { state.profileLoaded = true; }
    finally { 
        profileLoadInFlight = false; 
        removeSkeletons();
        renderBalance(); renderWager();
    }
}

async function syncDataWithBot() {
    if (syncInFlight || profileLoadInFlight) return;
    if (!state.userId) return;
    const sendingTrade = hasUnsyncedTrade;
    hasUnsyncedTrade = false; 
    syncInFlight = true;
    try {
        await fetch(`${BASE_URL}/api/sync`, {
            method: 'POST', headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
            body: JSON.stringify({ user_id: state.userId, real_balance: state.realBalance, bonus_balance: state.bonusBalance, history: state.history, initData: getInitData(), trade_done: sendingTrade ? 1 : 0 })
        });
    } catch (err) { if (sendingTrade) hasUnsyncedTrade = true; } 
    finally { syncInFlight = false; }
}

function scheduleSync(isTrade = false) {
    if (!state.profileLoaded) return;
    if (isTrade) hasUnsyncedTrade = true;
    clearTimeout(syncDebounceTimer);
    syncDebounceTimer = setTimeout(syncDataWithBot, SYNC_DEBOUNCE_MS);
}

async function init() {
    try {
        state.tg = window.Telegram ? window.Telegram.WebApp : null;
        if (state.tg) { 
            state.tg.enableClosingConfirmation(); 
            state.tg.expand(); 
            state.tg.ready(); 
        }
        state.userId = (state.tg && state.tg.initDataUnsafe && state.tg.initDataUnsafe.user) ? state.tg.initDataUnsafe.user.id : 99999;
        
        loadState(); 
        document.getElementById('currentAssetLabel').textContent = state.currentAsset;
        
        renderHistory(); buildTicker(); bindAmountInput(); bindQuickAmounts();
        bindDirectionButtons(); 
        
        initMarketChart(ASSET_PRICES[state.currentAsset]); 
        setInterval(refreshTicker, 4000);
        
        await loadUserProfileFromServer();
        startBackgroundPolling();
        setInterval(() => { if(hasUnsyncedTrade) scheduleSync(); }, SYNC_INTERVAL_MS);
    } catch (err) {}
}

function loadState() {
    try {
        const sReal = localStorage.getItem(STORAGE_KEY_REAL); const sBonus = localStorage.getItem(STORAGE_KEY_BONUS);
        if (sReal !== null) state.realBalance = parseFloat(sReal); if (sBonus !== null) state.bonusBalance = parseFloat(sBonus);
        const savedHistory = localStorage.getItem(STORAGE_KEY_HISTORY); state.history = savedHistory ? JSON.parse(savedHistory) : [];
        state.favorites = JSON.parse(localStorage.getItem('tt_fav_assets')) || [];
        state.currentAsset = localStorage.getItem('tt_current_asset') || 'SOL';
    } catch (err) { 
        state.history = []; state.favorites = []; state.currentAsset = 'SOL';
    }
}

function persistBalance(options) {
    try { localStorage.setItem(STORAGE_KEY_REAL, String(state.realBalance)); localStorage.setItem(STORAGE_KEY_BONUS, String(state.bonusBalance)); } catch (err) {}
    if (!options || !options.skipSync) scheduleSync();
}

function persistHistory() {
    try { localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(state.history)); } catch (err) {}
    scheduleSync();
}

function buildTicker() {
    const track = document.getElementById('tickerTrack');
    const items = [];
    for (let i = 0; i < 8; i++) { TICKER_SYMBOLS.forEach(sym => items.push(makeTickerItem(sym))); }
    track.innerHTML = items.join('');
}

function makeTickerItem(symbol) {
    const change = assetChanges[symbol];
    const up = parseFloat(change) >= 0; const arrow = up ? '📈' : '📉'; const cls = up ? 't-up' : 't-down'; const sign = up ? '+' : '';
    return `<span class="ticker-item"><b>${symbol}</b> ${arrow} <span class="${cls}">${sign}${change}%</span></span>`;
}

function refreshTicker() {
    try {
        TICKER_SYMBOLS.forEach(sym => { 
            let current = parseFloat(assetChanges[sym]);
            let shift = (Math.random() * 0.6 - 0.3);
            let val = current + shift;
            if(val > 6) val = 6; if(val < -6) val = -6;
            assetChanges[sym] = val.toFixed(2); 
        });

        const track = document.getElementById('tickerTrack');
        if (track) {
            const items = track.querySelectorAll('.ticker-item');
            items.forEach(item => {
                const sym = item.querySelector('b').textContent;
                const change = assetChanges[sym];
                if (change !== undefined) {
                    const up = parseFloat(change) >= 0; 
                    const arrow = up ? '📈' : '📉'; const cls = up ? 't-up' : 't-down'; const sign = up ? '+' : '';
                    item.innerHTML = `<b>${sym}</b> ${arrow} <span class="${cls}">${sign}${change}%</span>`;
                }
            });
        }
        const dd = document.getElementById('assetDropdown');
        if (dd && dd.classList.contains('show')) {
            const ddItems = dd.querySelectorAll('.asset-item');
            ddItems.forEach(item => {
                const symEl = item.querySelector('.asset-sym');
                const pctEl = item.querySelector('.asset-pct');
                if (symEl && pctEl) {
                    const sym = symEl.textContent;
                    const change = assetChanges[sym];
                    if (change !== undefined) {
                        const isPos = parseFloat(change) >= 0;
                        pctEl.className = `asset-pct ${isPos ? 'pos' : 'neg'}`;
                        pctEl.textContent = `${isPos ? '+' : ''}${change}%`;
                    }
                }
            });
        }
    } catch (err) {}
}

function toggleAssetDropdown() {
    if (state.tradeInProgress) return;
    const dd = document.getElementById('assetDropdown');
    dd.classList.toggle('show');
    if (dd.classList.contains('show')) renderAssetList();
}

function renderAssetList() {
    const list = document.getElementById('assetDropdown');
    list.innerHTML = '';
    const sorted = [...TICKER_SYMBOLS].sort((a, b) => {
        const aFav = state.favorites.includes(a);
        const bFav = state.favorites.includes(b);
        if (aFav && !bFav) return -1;
        if (!aFav && bFav) return 1;
        return 0;
    });

    sorted.forEach(sym => {
        const item = document.createElement('div');
        item.className = 'asset-item';
        item.onclick = (e) => {
            if (e.target.classList.contains('asset-star')) return;
            selectAsset(sym);
        };
        const change = assetChanges[sym];
        const isPos = parseFloat(change) >= 0;
        const isFav = state.favorites.includes(sym);
        item.innerHTML = `
            <div class="asset-info">
                <span class="asset-sym">${sym}</span>
                <span class="asset-pct ${isPos ? 'pos' : 'neg'}">${isPos ? '+' : ''}${change}%</span>
            </div>
            <div class="asset-star ${isFav ? 'fav' : ''}" onclick="toggleFavorite('${sym}', event)">★</div>
        `;
        list.appendChild(item);
    });
}

function toggleFavorite(sym, evt) {
    evt.stopPropagation();
    if (state.favorites.includes(sym)) { state.favorites = state.favorites.filter(f => f !== sym); } 
    else { state.favorites.push(sym); }
    localStorage.setItem('tt_fav_assets', JSON.stringify(state.favorites));
    renderAssetList();
}

function selectAsset(sym) {
    state.currentAsset = sym; localStorage.setItem('tt_current_asset', sym);
    document.getElementById('currentAssetLabel').textContent = sym;
    document.getElementById('assetDropdown').classList.remove('show');
    initMarketChart(ASSET_PRICES[sym]);

function recalculateAmountFromPercent() {
    if (!state.activePercent) return;
    let amt = 0; const total = getTotalBalance();
    if (state.activePercent === 'MAX') { amt = total; } 
    else { amt = round2(total * (parseInt(state.activePercent) / 100)); }
    document.getElementById('amountInput').value = amt.toFixed(2);
    handleAmountChange();
}

function bindAmountInput() { 
    const input = document.getElementById('amountInput');
    input.addEventListener('input', () => {
        state.activePercent = null;
        document.querySelectorAll('.quick-chip').forEach(c => c.classList.remove('active'));
        handleAmountChange();
    });
}

function bindQuickAmounts() {
    document.querySelectorAll('.quick-chip').forEach(chip => {
        chip.addEventListener('click', () => {
            document.querySelectorAll('.quick-chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            state.activePercent = chip.dataset.percent;
            recalculateAmountFromPercent();

function handleAmountChange() {
    const amount = getEnteredAmount(); const total = getTotalBalance();
    const upBtn = document.getElementById('upButton'); const downBtn = document.getElementById('downButton');
    if (amount > 0 && amount <= total && !state.tradeInProgress) { upBtn.disabled = false; downBtn.disabled = false; } 
    else { upBtn.disabled = true; downBtn.disabled = true; }
}

function getEnteredAmount() {
    let val = document.getElementById('amountInput').value; val = val.replace(',', '.');
    const raw = parseFloat(val); if (isNaN(raw) || raw <= 0) return 0;
    return round2(raw);
}

let marketCandles = []; let marketChartTimer = null;
function initMarketChart(basePrice) {
    if (!basePrice) basePrice = ASSET_PRICES[state.currentAsset] || 100;
    marketCandles = generateInitialCandles(34, basePrice); drawMarketChart();
    if (marketChartTimer) clearInterval(marketChartTimer);
    marketChartTimer = setInterval(tickMarketChart, 2500); window.addEventListener('resize', drawMarketChart);
}

function generateInitialCandles(n, basePrice) {
    let price = basePrice; const arr = [];
    for (let i = 0; i < n; i++) { const candle = buildNextCandle(price); arr.push(candle); price = candle.c; }
    return arr;
}

function buildNextCandle(openPrice) {
    const open = openPrice; const volatility = open * 0.015; const change = (Math.random() - 0.48) * volatility;
    let close = Math.max(open * 0.001, open + change); 
    const high = Math.max(open, close) + Math.random() * (volatility * 0.4);
    const low = Math.max(open * 0.0001, Math.min(open, close) - Math.random() * (volatility * 0.4));
    return { o: open, h: high, l: low, c: close, v: 15 + Math.random() * 85 };
}

function tickMarketChart() {
    if (state.tradeInProgress) return; 
    if (state.activeTrade) {
        state.activeTrade = null;
        document.getElementById('chartBox').classList.remove('fullscreen');
    }
    const last = marketCandles[marketCandles.length - 1]; const next = buildNextCandle(last.c);
    marketCandles.push(next); if (marketCandles.length > 34) marketCandles.shift();
    drawMarketChart();
}

function computeChartGeometry(cssWidth, cssHeight) {
    const priceAreaH = cssHeight * 0.68; const volumeAreaTop = cssHeight * 0.72; const volumeAreaH = cssHeight * 0.28;
    const highs = marketCandles.map(c => c.h); const lows = marketCandles.map(c => c.l);
    const maxPrice = Math.max(...highs); const minPrice = Math.min(...lows);
    return {
        cssWidth, cssHeight, priceAreaH, volumeAreaTop, volumeAreaH,
        minPrice, maxPrice, priceRange: Math.max(maxPrice - minPrice, 0.01),
        maxVolume: Math.max(...marketCandles.map(c => c.v), 1),
        n: marketCandles.length, slotWidth: cssWidth / marketCandles.length,
        bodyWidth: Math.max(2, (cssWidth / marketCandles.length) * 0.55)
    };
}

function priceToY(price, geo) { return geo.priceAreaH - ((price - geo.minPrice) / geo.priceRange) * geo.priceAreaH; }
function indexToX(index, geo) { return index * geo.slotWidth + geo.slotWidth / 2; }
function indexToSlotRightEdge(index, geo) { return (index + 1) * geo.slotWidth; }

function projectToScreen(x, y, cam) { return { x: cam.panX + cam.scale * x, y: cam.panY + cam.scale * y }; }

function getChartCameraTransform(geo) {
    const trade = state.activeTrade; const centerX = geo.cssWidth / 2; const centerY = geo.priceAreaH / 2;
    if (!trade) return { scale: 1, panX: 0, panY: 0 };
    const p = trade.animProgress || 0; const ZOOM_OUT_START = TRADE_GROW_END;
    const leadIndex = trade.entryIndex + (clamp01(p / TRADE_GROW_END) * trade.pathCandles.length);
    const leadX = leadIndex * geo.slotWidth + geo.slotWidth / 2;
    const focusY = priceToY(trade.entryPrice, geo);
    const peakZoom = trade.zoomTarget || MAX_ZOOM;

    if (p < ZOOM_OUT_START) {
        const ramp = p <= ZOOM_IN_END ? (1 - Math.pow(1 - clamp01(p / ZOOM_IN_END), 3)) : 1;
        const scale = p <= ZOOM_IN_END ? 1 + (peakZoom - 1) * ramp : peakZoom;
        return { scale, panX: leadX * (1 - scale) + (centerX - leadX) * ramp, panY: focusY * (1 - scale) + (centerY - focusY) * ramp };
    }
    const u = Math.pow(clamp01((p - ZOOM_OUT_START) / (1 - ZOOM_OUT_START)), 3);
    const scaleAtHold = peakZoom;
    const panXAtHold = leadX * (1 - scaleAtHold) + (centerX - leadX) * 1;
    const panYAtHold = focusY * (1 - scaleAtHold) + (centerY - focusY) * 1;
    return { scale: scaleAtHold + (1 - scaleAtHold) * u, panX: panXAtHold + (0 - panXAtHold) * u, panY: panYAtHold + (0 - panYAtHold) * u };
}

function drawMarketChart() {
    const canvas = document.getElementById('marketCanvas');
    if (!canvas || marketCandles.length === 0) return;
    const dpr = window.devicePixelRatio || 1; const cssWidth = canvas.clientWidth || 320; const cssHeight = canvas.clientHeight || 180;
    canvas.width = cssWidth * dpr; canvas.height = cssHeight * dpr;
    const ctx = canvas.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, cssWidth, cssHeight);
    const geo = computeChartGeometry(cssWidth, cssHeight); const cam = getChartCameraTransform(geo);
    ctx.save();
    if (cam.scale !== 1 || cam.panX !== 0 || cam.panY !== 0) { ctx.translate(cam.panX, cam.panY); ctx.scale(cam.scale, cam.scale); }
    drawTradeZoneFill(ctx, geo);
    const trade = state.activeTrade; const growTNow = trade ? clamp01((trade.animProgress || 0) / TRADE_GROW_END) : 0;

    marketCandles.forEach((candle, i) => {
        if (trade && i > trade.entryIndex && i <= trade.expiryIndex) {
            const segStart = (i - trade.entryIndex - 1) / trade.pathCandles.length;
            if (growTNow <= segStart) return;
        }
        const x = indexToX(i, geo); const up = candle.c >= candle.o; 
        const yHigh = priceToY(candle.h, geo); const yLow = priceToY(candle.l, geo); const yOpen = priceToY(candle.o, geo); const yClose = priceToY(candle.c, geo);
        
        const grad = ctx.createLinearGradient(x - geo.bodyWidth / 2, 0, x + geo.bodyWidth / 2, 0);
        if (up) {
            grad.addColorStop(0, '#158F4E'); grad.addColorStop(0.5, '#32EA8F'); grad.addColorStop(1, '#158F4E');
        } else {
            grad.addColorStop(0, '#B82328'); grad.addColorStop(0.5, '#FF6B6B'); grad.addColorStop(1, '#B82328');
        }
        
        ctx.strokeStyle = up ? '#32EA8F' : '#FF6B6B'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x, yHigh); ctx.lineTo(x, yLow); ctx.stroke();
        const bodyTop = Math.min(yOpen, yClose); const bodyHeight = Math.max(1.5, Math.abs(yClose - yOpen));
        
        ctx.fillStyle = grad; 
        ctx.fillRect(x - geo.bodyWidth / 2, bodyTop, geo.bodyWidth, bodyHeight);
        
        const volHeight = (candle.v / geo.maxVolume) * geo.volumeAreaH;
        ctx.globalAlpha = 0.55; 
        ctx.fillRect(x - geo.bodyWidth / 2, geo.volumeAreaTop + (geo.volumeAreaH - volHeight), geo.bodyWidth, volHeight);
        ctx.globalAlpha = 1;
    });
    drawTradeLines(ctx, geo); ctx.restore(); drawFlyingPopups(ctx);
}

function drawTradeZoneFill(ctx, geo) {
    const trade = state.activeTrade; if (!trade) return;
    const xStart = indexToX(trade.entryIndex, geo); const xEnd = indexToSlotRightEdge(trade.expiryIndex, geo);
    const yEntry = priceToY(trade.entryPrice, geo); const zoneX = Math.min(xStart, xEnd); const zoneWidth = Math.abs(xEnd - xStart);
    const entrance = clamp01(((trade.animProgress || 0) - ZOOM_IN_END) / 0.06);
    ctx.save();
    if (!trade.revealed) {
        ctx.globalAlpha = (0.07 + (Math.sin(performance.now() / 260) * 0.5 + 0.5) * 0.05) * entrance;
        ctx.fillStyle = 'rgb(201, 169, 97)';
        if (trade.direction === 'up') ctx.fillRect(zoneX, 0, zoneWidth, yEntry); else ctx.fillRect(zoneX, yEntry, zoneWidth, geo.priceAreaH - yEntry);
        ctx.restore(); return;
    }
    const revealT = clamp01((trade.animProgress - TRADE_GROW_END) / (1 - TRADE_GROW_END));
    const rgb = trade.result === 'win' ? '0, 255, 0' : '255, 0, 0';
    let alpha = trade.result === 'win' 
        ? (0.16 + (Math.sin(performance.now() / 170) * 0.5 + 0.5) * 0.22) * Math.sin(Math.min(revealT / 0.22, 1) * (Math.PI / 2)) * (1 - clamp01((revealT - 0.62) / 0.38))
        : 0.14 * (1 - clamp01(revealT / 0.65));
    if (trade.result === 'win') { ctx.shadowBlur = 24; ctx.shadowColor = `rgba(${rgb}, 0.9)`; }
    ctx.globalAlpha = Math.max(0, alpha); ctx.fillStyle = `rgb(${rgb})`;
    if (trade.direction === 'up') ctx.fillRect(zoneX, 0, zoneWidth, yEntry); else ctx.fillRect(zoneX, yEntry, zoneWidth, geo.priceAreaH - yEntry);
    ctx.restore();
}

function drawTradeLines(ctx, geo) {
    const trade = state.activeTrade; if (!trade) return;
    const xStart = indexToX(trade.entryIndex, geo); const xEnd = indexToX(trade.expiryIndex, geo);
    const yEntry = priceToY(trade.entryPrice, geo);
    let lineAlpha = clamp01(((trade.animProgress || 0) - ZOOM_IN_END) / 0.06);
    let glowFinish = false;
    if (trade.revealed) {
        const revealT = clamp01((trade.animProgress - TRADE_GROW_END) / (1 - TRADE_GROW_END));
        if (trade.result === 'win') { glowFinish = true; lineAlpha = 1 - clamp01((revealT - 0.55) / 0.45); }
        else lineAlpha = 1 - clamp01(revealT / 0.6);
    }
    ctx.save(); ctx.globalAlpha = Math.max(0, lineAlpha); ctx.setLineDash([4, 3]); ctx.lineWidth = 1; ctx.strokeStyle = '#E8C874';
    ctx.beginPath(); ctx.moveTo(xStart, 0); ctx.lineTo(xStart, geo.priceAreaH); ctx.stroke();
    if (glowFinish) { ctx.shadowBlur = 18; ctx.shadowColor = `rgba(${trade.result === 'win' ? '0,255,0' : '255,0,0'}, 0.9)`; }
    ctx.beginPath(); ctx.moveTo(xEnd, 0); ctx.lineTo(xEnd, geo.priceAreaH); ctx.stroke(); ctx.shadowBlur = 0;
    ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(xStart, yEntry); ctx.lineTo(indexToSlotRightEdge(trade.expiryIndex, geo), yEntry); ctx.stroke();
    ctx.restore();
}

function drawFlyingPopups(ctx) {
    const trade = state.activeTrade; if (!trade || !trade.flyingPopups) return;
    const now = performance.now();
    trade.flyingPopups.forEach(popup => {
        const t = clamp01((now - popup.bornAt) / FLIGHT_MS);
        if (t >= 1) { if (!popup.merged) { popup.merged = true; trade.displayedTotal = round2(trade.displayedTotal + popup.delta); updatePnlPanel(trade); pulsePnlAmount(); playMergeSound(popup.delta >= 0); } return; }
        const eased = t * t; const scale = 1 - 0.6 * t; const alpha = t < 0.75 ? 1 : (1 - (t - 0.75) / 0.25);
        ctx.save(); ctx.globalAlpha = Math.max(0, alpha); ctx.translate(popup.startX + (popup.targetX - popup.startX) * eased, popup.startY + (popup.targetY - popup.startY) * eased);
        ctx.scale(scale, scale); ctx.font = `700 13px ${CHART_MONO_FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = popup.positive ? '#1FAE64' : '#E5484D'; ctx.fillText(popup.text, 0, 0); ctx.restore();
    });
    trade.flyingPopups = trade.flyingPopups.filter(p => !p.merged);
}

function updatePnlPanel(trade) {
    const amountEl = document.getElementById('tradePnlAmount'); const percentEl = document.getElementById('tradePnlPercent');
    if (!amountEl || !percentEl) return;
    const positive = trade.displayedTotal >= 0;
    amountEl.textContent = formatSignedMoney(trade.displayedTotal);
    amountEl.className = `trade-pnl-amount ${positive ? 'positive' : 'negative'}`;
    const pct = trade.amount > 0 ? (trade.displayedTotal / trade.amount) * 100 : 0;
    percentEl.textContent = `${pct >= 0 ? '+' : ''}${pct.toFixed(0)}%`;
    percentEl.className = `trade-pnl-percent ${positive ? 'positive' : 'negative'}`;
}

function pulsePnlAmount() {
    const el = document.getElementById('tradePnlAmount'); if (!el) return;
    el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse');
}

function spawnTickPopup(trade, candleIndex, priceAtTick) {
    const canvas = document.getElementById('marketCanvas');
    if (!canvas) return;
    const cssWidth = canvas.clientWidth || 320;
    const cssHeight = canvas.clientHeight || 180;
    const geo = computeChartGeometry(cssWidth, cssHeight);
    const cam = getChartCameraTransform(geo);

    const dataX = indexToX(candleIndex, geo);
    const dataY = priceToY(priceAtTick, geo) - 10;
    const startScreen = projectToScreen(dataX, dataY, cam);

    const favorable = trade.direction === 'up' ? (priceAtTick - trade.entryPrice) : (trade.entryPrice - priceAtTick);
    const finalFavorableMove = trade.direction === 'up' ? (trade.finalPrice - trade.entryPrice) : (trade.entryPrice - trade.finalPrice);
    
    let fraction = finalFavorableMove !== 0 ? favorable / finalFavorableMove : 1;
    let newTotal = trade.netChange * fraction;
    
    if (candleIndex === trade.expiryIndex) newTotal = trade.netChange;
    if (newTotal < -trade.amount) newTotal = -trade.amount;

    const delta = round2(newTotal - trade.lockedNet);
    trade.lockedNet = newTotal;

    trade.flyingPopups.push({
        startX: startScreen.x,
        startY: Math.max(14, Math.min(geo.cssHeight - 14, startScreen.y)),
        targetX: geo.cssWidth / 2,
        targetY: geo.cssHeight - 8,
        delta: delta,
        text: formatSignedMoney(delta),
        positive: delta >= 0,
        bornAt: performance.now(),
        merged: false
    });
}

function updateGrowingPath(trade, totalProgress) {
    const growT = clamp01(totalProgress / TRADE_GROW_END);
    const segment = 1 / trade.pathCandles.length;
    let prevClose = trade.entryPrice;

    for (let i = 0; i < trade.pathCandles.length; i++) {
        const segStart = i * segment;
        const localT = clamp01((growT - segStart) / segment);
        const eased = 1 - Math.pow(1 - localT, 3);

        const target = trade.pathCandles[i];
        const candleIndex = trade.entryIndex + 1 + i;
        const candle = marketCandles[candleIndex];
        
        if (candle) {
            candle.o = prevClose;
            candle.c = prevClose + (target.c - prevClose) * eased;
            candle.h = prevClose + (target.h - prevClose) * eased;
            candle.l = prevClose + (target.l - prevClose) * eased;
            candle.v = target.v * eased;

            if (localT >= 0.999 && !trade.tickFired[i]) {
                trade.tickFired[i] = true;
                spawnTickPopup(trade, candleIndex, target.c);
            }
        }
        prevClose = target.c;
    }
    
    // Показываем результат на 95% прогресса, если цифры уже долетели
    if (!trade.revealed && totalProgress >= 0.95 && trade.flyingPopups.length === 0) {
        revealTradeResult(trade);
    }
}

function runTradeAnimation() {
    const trade = state.activeTrade; if (!trade) return;
    if (tradeAnimFrameId) cancelAnimationFrame(tradeAnimFrameId);
    
    function frame(now) {
        try {
            const elapsed = now - trade.animStartTime;
            const totalProgress = Math.min(elapsed / trade.durationMs, 1);
            trade.animProgress = totalProgress;
            
            updateGrowingPath(trade, totalProgress); 
            drawMarketChart();
            
            // Минимальная задержка зума (150 мс), чтобы окно плавно появилось
            let timeSinceReveal = trade.revealed ? (now - trade.revealTime) : 0;
            let holdScreen = trade.revealed && timeSinceReveal < 150;

            if (totalProgress < 1 || trade.flyingPopups.length > 0 || !trade.revealed || holdScreen) {
                tradeAnimFrameId = requestAnimationFrame(frame);
            } else {
                state.activeTrade = null; 
                document.getElementById('chartBox').classList.remove('fullscreen');
                drawMarketChart(); 
                state.tradeInProgress = false; 
                handleAmountChange();
            }
        } catch (e) {
            state.activeTrade = null;
            document.getElementById('chartBox').classList.remove('fullscreen');
            state.tradeInProgress = false; handleAmountChange();
        }
    }
    tradeAnimFrameId = requestAnimationFrame(frame);
}

function switchTab(pageId, evt) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    if (evt && evt.currentTarget) evt.currentTarget.classList.add('active');
    if (pageId === 'history-page') renderHistory();
    hideNotice();
}

function renderBalance() {
    const el = document.getElementById('globalBalance');
    if (document.getElementById('bootLoader').classList.contains('hidden')) {
        el.classList.remove('skeleton');
    }
    el.textContent = formatMoney(getTotalBalance());
    el.classList.toggle('negative', getTotalBalance() < 0);
    document.getElementById('accountSub').textContent = getTotalBalance() < 0 ? 'Estado: Llamada de margen (Margin Call)' : 'Estado: Activo';
}

function renderWager() {
    const fill = document.getElementById('wagerFill');
    const txt = document.getElementById('wagerText');
    if (!fill || !txt) return;

    if (document.getElementById('bootLoader').classList.contains('hidden')) {
        txt.classList.remove('skeleton');
    }

    let pct = 0;
    if (state.requiredTrades > 0) { pct = (state.turnover / state.requiredTrades) * 100; } 
    else if (state.turnover > 0) { pct = 100; }
    if (pct > 100) pct = 100;

    fill.style.width = pct + '%';
    txt.textContent = `${formatMoney(state.turnover)} / ${formatMoney(state.requiredTrades)} (${pct.toFixed(1)}%)`;
}

function formatMoney(value) { return (value < 0 ? '-' : '') + state.currencySymbol + Math.abs(value).toLocaleString('en-US', { maximumFractionDigits: 2, minimumFractionDigits: 0 }); }
function formatSignedMoney(value) { return (value >= 0 ? '+' : '-') + state.currencySymbol + Math.abs(value).toLocaleString('en-US', { maximumFractionDigits: 2, minimumFractionDigits: 0 }); }

function computeTradeZoomTarget(entryPrice, pathCandles, geo) {
    let hi = entryPrice, lo = entryPrice;
    pathCandles.forEach(c => {
        if (c.h > hi) hi = c.h;
        if (c.l < lo) lo = c.l;
    });
    const pathRange = Math.max(hi - lo, 0.01);
    const raw = (ZOOM_SAFE_FRACTION * geo.priceRange) / pathRange;
    return Math.max(ZOOM_FLOOR, Math.min(MAX_ZOOM, raw));
}

function bindDirectionButtons() {
    document.getElementById('upButton').addEventListener('click', () => placeTrade('up'));
    document.getElementById('downButton').addEventListener('click', () => placeTrade('down'));
}

async function placeTrade(direction) {
    if (state.tradeInProgress) return;
    const amount = getEnteredAmount();
    
    if (amount <= 0) { triggerHaptic('medium'); return showNotice('Ingrese el monto de inversión', 'lose'); }
    if (amount > getTotalBalance()) { triggerHaptic('medium'); return showNotice('Fondos insuficientes', 'lose'); }

    triggerHaptic('heavy');
    state.tradeInProgress = true; 
    document.getElementById('upButton').disabled = true; 
    document.getElementById('downButton').disabled = true;

    try {
        const response = await fetch(`${BASE_URL}/api/place_trade`, {
            method: 'POST', headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
            body: JSON.stringify({ user_id: state.userId, amount: amount, direction: direction, initData: getInitData() })
        });
        const data = await response.json();
        
        if (data.status !== 'success') {
            let msg = 'Error al ejecutar la orden';
            if (data.message === 'bet_too_small') msg = `Inversión mínima: ${formatMoney(data.min_bet)}`;
            else if (data.message === 'insufficient_funds') msg = 'Fondos insuficientes';
            triggerHaptic('medium');
            showNotice(msg, 'lose'); state.tradeInProgress = false; handleAmountChange();
            return;
        }

        let tempReal = state.realBalance; let tempBonus = state.bonusBalance;
        if (amount <= tempReal) tempReal -= amount;
        else { tempBonus = Math.max(0, tempBonus - (amount - tempReal)); tempReal = 0; }
        state.realBalance = tempReal; state.bonusBalance = tempBonus; renderBalance();

        state.turnover = data.turnover !== undefined ? parseFloat(data.turnover) : state.turnover;
        state.requiredTrades = data.required_trades !== undefined ? parseFloat(data.required_trades) : state.requiredTrades;
        renderWager();

        const entryPrice = marketCandles[marketCandles.length - 1].c;
        let pathCandles = []; let finalPrice, favorableMove; let attempts = 0;

        do {
            pathCandles = []; let cursor = entryPrice;
            for (let i = 0; i < TRADE_CANDLES; i++) { const c = buildNextCandle(cursor); pathCandles.push(c); cursor = c.c; }
            finalPrice = pathCandles[pathCandles.length - 1].c;
            favorableMove = direction === 'up' ? (finalPrice - entryPrice) : (entryPrice - finalPrice);
            if (favorableMove === 0) favorableMove = data.won ? (entryPrice * 0.0005) : -(entryPrice * 0.0005);
            attempts++;
        } while ((favorableMove > 0) !== data.won && attempts < 100);

        if ((favorableMove > 0) !== data.won) {
             const shift = data.won ? (entryPrice * 0.005) : -(entryPrice * 0.005);
             finalPrice = entryPrice + (direction === 'up' ? shift : -shift);
             pathCandles[pathCandles.length - 1].c = finalPrice;
        }

        document.getElementById('chartBox').classList.add('fullscreen');
        
        for (let i = 0; i < TRADE_CANDLES; i++) {
            marketCandles.push({ o: entryPrice, h: entryPrice, l: entryPrice, c: entryPrice, v: 0 });
        }
        while (marketCandles.length > 34) marketCandles.shift();

        const geo = computeChartGeometry(document.getElementById('marketCanvas').clientWidth, document.getElementById('marketCanvas').clientHeight);
        const zoomTarget = computeTradeZoomTarget(entryPrice, pathCandles, geo);
        
        state.activeTrade = {
            entryIndex: marketCandles.length - 1 - TRADE_CANDLES, 
            expiryIndex: marketCandles.length - 1,
            entryPrice: entryPrice, 
            finalPrice: finalPrice, 
            direction: direction, 
            pathCandles: pathCandles,
            tickFired: new Array(TRADE_CANDLES).fill(false), 
            flyingPopups: [], 
            lockedNet: 0, 
            displayedTotal: 0,
            won: data.won, 
            netChange: data.net_change, 
            newReal: data.new_real, 
            newBonus: data.new_bonus, 
            amount: amount,
            revealed: false, 
            result: null, 
            animProgress: 0, 
            animStartTime: performance.now(),
            durationMs: randomBetween(TRADE_MIN_MS, TRADE_MAX_MS), 
            zoomTarget: zoomTarget
        };
        
        updatePnlPanel(state.activeTrade); 
        runTradeAnimation();
        
    } catch (err) {
        triggerHaptic('medium');
        if (state.activeTrade) state.activeTrade = null;
        document.getElementById('chartBox').classList.remove('fullscreen');
        showNotice('Error al ejecutar la orden', 'lose'); 
        state.tradeInProgress = false; 
        handleAmountChange();
    }
}

function revealTradeResult(trade) {
    trade.revealed = true;
    trade.revealTime = performance.now();
    trade.result = trade.won ? 'win' : 'lose';

    state.realBalance = trade.newReal;
    state.bonusBalance = trade.newBonus;
    persistBalance({ skipSync: true });
    renderBalance();
    
    if (state.activePercent) {
        recalculateAmountFromPercent();
    }
    
    addHistoryEntry(state.currentAsset, trade.direction, trade.amount, trade.netChange);

    let type = 'lose';
    if (trade.netChange > 0) {
        const pctMultiplier = (trade.netChange / trade.amount) * 100;
        if (pctMultiplier >= 200) type = 'jackpot';
        else type = 'win';
    }

    if (type === 'win') {
        triggerHaptic('heavy');
        setTimeout(() => triggerHaptic('heavy'), 200);
        playResultSound('win'); // <--- Звук победы
        showNotice(`${formatSignedMoney(trade.netChange)}`, 'win');
    } else if (type === 'jackpot') {
        triggerHaptic('heavy');
        setTimeout(() => triggerHaptic('heavy'), 150);
        setTimeout(() => triggerHaptic('heavy'), 300);
        playResultSound('jackpot'); // <--- Звук джекпота
        showNotice(`JACKPOT<br>${formatSignedMoney(trade.netChange)}`, 'jackpot');
    } else {
        triggerHaptic('light');
        playResultSound('lose'); // <--- Нейтральный звук проигрыша
        showNotice(`${formatSignedMoney(trade.netChange)}`, 'lose');
    }
}

function addHistoryEntry(asset, direction, amount, netChange) {
    state.history.unshift({ asset: asset, direction: direction, amount: amount, profit: netChange, timestamp: Date.now() });
    if (state.history.length > MAX_HISTORY_ITEMS) state.history.length = MAX_HISTORY_ITEMS;
    persistHistory(); if (document.getElementById('history-page').classList.contains('active')) renderHistory();
}

function renderHistory() {
    const list = document.getElementById('historyList'); if (!list) return;
    if (state.history.length === 0) { list.innerHTML = '<div class="empty-history">Aún no hay operaciones</div>'; return; }
    list.innerHTML = '';
    state.history.forEach(entry => {
        const row = document.createElement('div'); 
        
        const pctMultiplier = (entry.profit / entry.amount) * 100;
        let type = 'lose';
        if (entry.profit > 0) {
            if (pctMultiplier >= 200) type = 'jackpot';
            else type = 'win';
        }

        row.className = `history-item ${type}`;
        
        let pctHtml = '';
        if (type !== 'lose') {
            pctHtml = `<span class="history-pct ${type}">+${pctMultiplier.toFixed(0)}%</span>`;
        }

        const assetName = entry.asset || 'SOL';
        const dirText = entry.direction === 'up' ? 'Sube' : 'Baja';

        row.innerHTML = `
            <div class="history-left">
                <div class="history-icon">${entry.direction === 'up' ? '▲' : '▼'}</div>
                <div class="history-meta">
                    <div class="history-ticker">${assetName} · ${dirText} · ${formatMoney(entry.amount)}</div>
                    <div class="history-time">${new Date(entry.timestamp).toLocaleString(undefined, {day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'})}</div>
                </div>
            </div>
            <div class="history-amount-wrap">
                <div class="history-amount ${type}">${formatSignedMoney(entry.profit)}</div>
                ${pctHtml}
            </div>
        `;
        list.appendChild(row);
    });
}

let noticeTimer = null;
function showNotice(message, type) {
    const overlay = document.getElementById('noticeOverlay');
    const msgBox = document.getElementById('noticeMsg');
    msgBox.innerHTML = message;
    msgBox.className = `notice-msg ${type}`;
    overlay.style.display = 'flex';
    if (noticeTimer) clearTimeout(noticeTimer);
    
    // Окно будет видно суммарно 2.5 секунды (1с в зуме и 1.5с на свернутом графике)
    noticeTimer = setTimeout(() => { overlay.style.display = 'none'; }, 2500);
}
function hideNotice() { document.getElementById('noticeOverlay').style.display = 'none'; }
document.addEventListener('DOMContentLoaded', init);
